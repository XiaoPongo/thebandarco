<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      background-color: black;
    }

    #vanta-bg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards 0.5s;
    }

    .message h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .message p {
      font-size: 1.2rem;
    }

    .countdown {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #ccc;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<div id="vanta-bg"></div>

<div class="message">
  <h1>Whoops, this page doesn't exist.</h1>
  <p>Redirecting you to the <a href="{{ site.baseurl }}/blog/" style="color:#fff; text-decoration: underline;">Blog</a>...</p>
  <p class="countdown">Redirecting in <span id="count">3</span> seconds...</p>
</div>

<!-- ✅ Vanta & P5 CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.trunk.min.js"></script>

<script>
  window.addEventListener('load', function () {
    // ✅ Initialize Vanta
    VANTA.TRUNK({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xde1a22,
      spacing: 3.00
    });

    // ✅ Countdown
    let count = 3;
    const counterEl = document.getElementById("count");

    const interval = setInterval(() => {
      count--;
      if (count <= 0) {
        clearInterval(interval);
        window.location.href = "{{ site.baseurl }}/blog/";
      } else {
        counterEl.textContent = count;
      }
    }, 1000);
  });
</script>

</body>
</html>
