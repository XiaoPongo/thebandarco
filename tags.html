---
layout: page
title: All Tags
permalink: /blog/tags/
---

<h1>All Tags</h1>

<ul class="tags-list">
    {% assign sorted_tags = site.tags | sort %}
    {% for tag in sorted_tags %}
        {% assign t = tag | first %}
        <li>
            <a href="/blog/tag/{{ t | slugify }}/">{{ t }} ({{ tag | last | size }})</a>
        </li>
    {% endfor %}
</ul>
