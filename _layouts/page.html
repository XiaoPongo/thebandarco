<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome - The Bandar Co.</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      color: white;
      overflow: auto;
      background-color: #000;
    }

    /* Vanta Header */
    #vanta-header {
      width: 100%;
      height: 400px;
      position: relative;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    #vanta-header .container {
      position: relative;
      z-index: 10;
    }

    #vanta-header h1 {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #vanta-header hr.small {
      border-color: rgba(255,255,255,0.6);
      width: 70px;
      margin: 1rem auto;
    }

    #vanta-header .subheading {
      font-size: 1.8rem;
      color: rgba(255,255,255,0.95);
      font-weight: 500;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* Main Content */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      margin-bottom: 100px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      margin: 0 -15px;
    }

    /* Rest of your original styling */
    .logo {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.5s;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 3;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.7s;
    }

    nav {
      display: none;
      flex-direction: column;
      gap: 10px;
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      opacity: 0;
      z-index: 2;
      animation: fadeIn 2s ease forwards 1.9s;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      -webkit-text-stroke: 0.6px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 0 1rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards 2.5s;
    }

    .main-content h1, .main-content p {
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .main-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .typed-text {
      display: inline;
      border-right: 2px solid transparent;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      vertical-align: bottom;
    }

    .typed-text::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
      position: relative;
      left: 2px;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }

    .main-content p {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.2s;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.5s;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      -webkit-text-stroke: 0.4px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      nav {
        display: flex;
        position: absolute;
        top: 20px;
        right: 30px;
        background: none;
        flex-direction: row;
        gap: 25px;
        padding: 0;
        opacity: 0;
        animation: fadeIn 2s ease forwards 1.9s;
      }
    }

    @media (max-width: 480px) {
      #vanta-header h1 {
        font-size: 3rem;
      }

      #vanta-header .subheading {
        font-size: 1.3rem;
      }

      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .social-icons a {
        font-size: 1.2rem;
      }

      .logo img {
        height: 40px;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    nav.popup {
      animation: none !important;
      display: flex !important;
      flex-direction: column;
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    nav.popup.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Vanta Header -->
  <header id="vanta-header">
    <div class="container">
      <h1>Hi, I'm <span class="typed-text"></span></h1>
      <hr class="small">
      <span class="subheading">B.Com. Grad<br>and more</span>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <div class="row">
      <div class="main-content">
        <div class="social-icons">
          <a href="https://wa.me/7588643764" target="_blank"><i class="fab fa-whatsapp"></i></a>
          <a href="https://instagram.com/chillbandar" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://linkedin.com/in/amay-deep-34158b229" target="_blank"><i class="fab fa-linkedin"></i></a>
          <a href="https://github.com/XiaoPongo" target="_blank"><i class="fab fa-github"></i></a>
          <a href="mailto:amaydeepp12510@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script>
    // Initialize Vanta Waves effect
    document.addEventListener('DOMContentLoaded', function() {
      const vantaEffect = VANTA.WAVES({
        el: "#vanta-header",
        mouseControls: true,
        touchControls: true,
        minHeight: 400.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x1030b,
        shininess: 50.00,
        waveHeight: 20.00,
        waveSpeed: 1.00,
        zoom: 0.85
      });

      // Handle window resize
      window.addEventListener('resize', function() {
        vantaEffect.resize();
      });

      // Start the typing animation
      if (typeof textArray !== 'undefined' && textArray.length) {
        setTimeout(type, newTextDelay + 250);
      }
    });

    function toggleNav() {
      const nav = document.getElementById("mobileNav");

      if (nav.classList.contains("show")) {
        nav.classList.remove("show");
        setTimeout(() => {
          nav.classList.remove("popup");
          nav.style.display = "none";
        }, 300);
      } else {
        nav.classList.add("popup");
        nav.style.display = "flex";
        setTimeout(() => {
          nav.classList.add("show");
        }, 10);
      }
    }

    // Typed text animation
    const typedTextSpan = document.querySelector(".typed-text");
    const textArray = ["Amay Deep.", "an Amateur Designer.", "a part-time Writer.", "an AI-assisted Developer."];
    const typingDelay = 100;
    const erasingDelay = 50;
    const newTextDelay = 2000;
    let textArrayIndex = 0;
    let charIndex = 0;

    function type() {
      if (charIndex < textArray[textArrayIndex].length) {
        typedTextSpan.textContent += textArray[textArrayIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, typingDelay);
      } else {
        setTimeout(erase, newTextDelay);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typedTextSpan.textContent = textArray[textArrayIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, erasingDelay);
      } else {
        textArrayIndex++;
        if (textArrayIndex >= textArray.length) textArrayIndex = 0;
        setTimeout(type, typingDelay + 1100);
      }
    }
  </script>
</body>
</html>
