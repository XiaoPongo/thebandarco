---
layout: default
---

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: #333;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-content {
    flex: 1 0 auto;
    background: transparent;
    z-index: 5;
    padding-bottom: 10rem;
  }

  footer {
    flex-shrink: 0;
    width: 100%;
    position: relative;
    z-index: 10;
    padding: 2rem 0;
    text-align: center;
  }

  .parallax-header {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 1rem;
    text-align: center;
  }

  .header-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    width: 500px;
    max-width: 90%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .header-box h1 {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 800;
    margin: 0;
    color: #5e4fa2;
  }

  .header-box .subheading {
    font-size: clamp(1.2rem, 3vw, 1.5rem);
    font-weight: 400;
    color: #333;
    margin-top: 20px;
    line-height: 1.4;
  }

  /* White Gradient Below the Card */
  .header-box::after {
    content: '';
    position: absolute;
    bottom: -50px;
    left: 0;
    width: 100%;
    height: 50px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
  }

  /* Hexagonal Background Elements */
  .hexagon {
    position: absolute;
    width: 100px;
    height: 57.74px; /* Height for a regular hexagon */
    background: rgba(255, 255, 255, 0.1);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: breathe 6s infinite ease-in-out;
  }

  /* Position Hexagons */
  .hexagon:nth-child(1) {
    top: 20%;
    left: 10%;
    width: 120px;
    height: 69.28px;
  }

  .hexagon:nth-child(2) {
    top: 60%;
    left: 15%;
    width: 80px;
    height: 46.19px;
  }

  .hexagon:nth-child(3) {
    top: 30%;
    right: 20%;
    width: 150px;
    height: 86.6px;
  }

  .hexagon:nth-child(4) {
    top: 70%;
    right: 10%;
    width: 100px;
    height: 57.74px;
  }

  /* Breathing Animation */
  @keyframes breathe {
    0%, 100% {
      transform: scale(1);
      opacity: 0.3;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.6;
    }
  }

  .scroll-indicator {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  .scroll-indicator p {
    color: white;
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }

  .arrow-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: arrowPulse 3s ease-in-out infinite;
    cursor: pointer;
  }

  .arrow-circle svg {
    stroke: #e2ff55;
  }

  @keyframes arrowPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  .content-section {
    padding: 10rem 2rem;
    position: relative;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .content-wrapper {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 4rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    margin: 2rem 0;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .content-wrapper h2 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 2rem;
    color: #2d3748;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .content-wrapper p {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #4a5568;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 768px) {
    .parallax-header {
      height: 80vh;
    }

    .header-box {
      padding: 2rem;
    }

    .content-section {
      padding: 4rem 1.5rem;
    }

    .content-wrapper {
      padding: 2rem;
    }
  }
</style>

<header class="parallax-header">
  <div class="header-box">
    <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
    <div class="subheading">{{ page.description }}</div>
  </div>

  <a href="#content" class="scroll-indicator">
    <p>Scroll to explore</p>
    <div class="arrow-circle">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="#e2ff55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </a>

  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
</header>

<main class="main-content">
  <div class="content-section" id="content">
    <div class="container">
      <div class="content-wrapper">
        {{ content }}
      </div>
    </div>
  </div>
</main>

<!-- Optional Scripts -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const links = document.querySelectorAll('a[href^="#"]');
    links.forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  });
</script>
