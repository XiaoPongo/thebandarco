---
layout: default
---

<style>
  /* Basic Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden;
    background: linear-gradient(90deg, rgba(35,83,166,1) 0%, rgba(87,109,199,1) 50%, rgba(143,49,214,1) 100%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-content {
    flex: 1 0 auto;
    z-index: 2;
    padding-bottom: 10rem;
  }

  /* Header */
  .parallax-header {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    position: relative;
    background: transparent;
    color: white;
    z-index: 1;
  }

  .header-box {
    background-color: rgba(255, 255, 255, 0.07);
    padding: 2.5rem 4rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    animation: breathe 5s ease-in-out infinite;
    backdrop-filter: blur(12px);
    max-width: 90%;
  }

  .header-box h1 {
    font-size: clamp(3rem, 7vw, 5rem);
    font-weight: 800;
    margin-bottom: 1rem;
    color: white;
    text-shadow: 0 3px 12px rgba(0,0,0,0.4);
  }

  .header-box .subheading {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 300;
    opacity: 0.95;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.02); opacity: 0.95; }
  }

  /* Scroll Arrow */
  .scroll-indicator {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: breathe 5s ease-in-out infinite;
  }

  .scroll-indicator p {
    color: white;
    font-size: 1.2rem;
    margin-bottom: 0.6rem;
  }

  .arrow-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid #cfff04;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: arrowPulse 2.5s infinite;
  }

  .arrow-circle svg {
    width: 22px;
    height: 22px;
    stroke: #cfff04;
  }

  @keyframes arrowPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  /* Content */
  .content-section {
    padding: 8rem 2rem;
  }

  .content-wrapper {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 3rem;
    margin: auto;
    max-width: 900px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255,255,255,0.3);
  }

  .content-wrapper h2 {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1.5rem;
  }

  .content-wrapper p {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #2e2e2e;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header-box {
      padding: 2rem;
    }

    .scroll-indicator {
      margin-top: 2rem;
    }
  }
</style>

<!-- Header -->
<header class="parallax-header">
  <div class="header-box">
    <h1>
      {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
    </h1>
    <div class="subheading">{{ page.description }}</div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator">
    <p>Scroll to explore</p>
    <div class="arrow-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <div class="content-section">
    <div class="content-wrapper">
      {{ content }}
    </div>
  </div>
</main>

<!-- Scripts -->
<script src="{{ site.baseurl }}/js/main.min.js"></script>
