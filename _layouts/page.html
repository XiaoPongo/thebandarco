---
layout: default
---

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: #333;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-content {
    flex: 1 0 auto;
    background: transparent;
    z-index: 5;
    padding-bottom: 10rem;
  }

  /* Header with 2/5th blue and orange gradient */
  .parallax-header {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: linear-gradient(to bottom, 
      #1a2a6c 0%, 
      #1a2a6c 40%, 
      #fdbb2d 40%, 
      #fdbb2d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 1rem;
    text-align: center;
  }

  /* Design element from 2nd image (top right corner) */
  .design-element {
    position: absolute;
    top: 10%;
    right: 5%;
    width: 30vw;
    max-width: 400px;
    height: 30vw;
    max-height: 400px;
    background: linear-gradient(135deg, rgba(253, 187, 45, 0.3) 0%, rgba(253, 187, 45, 0.1) 100%);
    border-radius: 20px;
    transform: rotate(15deg);
    z-index: 1;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(253, 187, 45, 0.2);
  }

  /* Header Box */
  .header-box {
    position: relative;
    z-index: 2;
    background-color: rgba(255, 255, 255, 0.12);
    padding: 3rem 4rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(12px);
    max-width: 90%;
    color: white;
    margin-top: -10%; /* Pull up into the orange section */
  }

  .header-box h1 {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 800;
    margin-bottom: 1rem;
    color: white;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    letter-spacing: 0.5px;
  }

  .header-divider {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #fdbb2d, rgba(253, 187, 45, 0.5));
    margin: 2rem auto;
    border-radius: 2px;
    box-shadow: 0 2px 10px rgba(253, 187, 45, 0.3);
  }

  .subheading {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 300;
    opacity: 0.95;
    line-height: 1.6;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  /* Navigation tabs */
  .header-tabs {
    position: absolute;
    bottom: 20%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 2rem;
    z-index: 3;
  }

  .header-tab {
    color: white;
    font-size: 1.2rem;
    font-weight: 500;
    text-decoration: none;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    transition: all 0.3s ease;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  }

  .header-tab:hover {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(5px);
  }

  /* Scroll Indicator */
  .scroll-indicator {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  .scroll-indicator p {
    color: white;
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    font-weight: 300;
    letter-spacing: 1px;
  }

  .arrow-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(253, 187, 45, 0.3);
  }

  .arrow-circle svg {
    stroke: #fdbb2d;
    stroke-width: 2;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  /* Content Section */
  .content-section {
    padding: 10rem 2rem;
    position: relative;
  }

  @media (max-width: 768px) {
    .parallax-header {
      height: 80vh;
      min-height: 500px;
      background: linear-gradient(to bottom, 
        #1a2a6c 0%, 
        #1a2a6c 45%, 
        #fdbb2d 45%, 
        #fdbb2d 100%);
    }

    .header-box {
      padding: 2rem;
      margin-top: -15%;
    }

    .design-element {
      width: 50vw;
      height: 50vw;
      top: 5%;
      right: 5%;
    }

    .header-tabs {
      bottom: 15%;
      gap: 1rem;
    }

    .header-tab {
      font-size: 1rem;
    }

    .content-section {
      padding: 5rem 1.5rem;
    }
  }
</style>

<!-- Header Title Card -->
<header class="parallax-header">
  <!-- Design element in top right corner -->
  <div class="design-element"></div>
  
  <div class="header-box">
    <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
    <div class="header-divider"></div>
    <div class="subheading">{{ page.description }}</div>
  </div>

  <!-- Navigation tabs -->
  <div class="header-tabs">
    <a href="#projects" class="header-tab">PROJECTS</a>
    <a href="#block" class="header-tab">BLOCK</a>
    <a href="#about" class="header-tab">ABOUT ME</a>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator">
    <p>Scroll to explore</p>
    <div class="arrow-circle">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</header>

<main class="main-content">
  <div class="content-section" id="content">
    <div class="container">
      <div class="content-wrapper">
        {{ content }}
      </div>
    </div>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  });
</script>
