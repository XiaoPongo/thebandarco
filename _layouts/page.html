---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Header Title Card</title>
    <style>
  /* Global Styles */
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }

  html {
      scroll-behavior: smooth;
  }

  body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f9fafb;
  }

  .main-content {
      flex: 1 0 auto;
      position: relative;
      background: transparent;
      z-index: 5;
      padding-bottom: 15rem;
  }

  /* Parallax Header */
  .parallax-header {
      position: relative;
      height: 100vh;
      min-height: 600px;
      background: #020024;
      background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(187, 0, 255, 1) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
  }

  .parallax-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 120%;
      height: 120%;
      background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(187, 0, 255, 1) 100%);
      opacity: 0.9;
  }

  /* Geometric Shapes */
  .geometric-shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .shape-1 {
      width: 300px;
      height: 300px;
      top: 10%;
      left: -10%;
      transform: rotate(45deg);
      border-radius: 20px;
  }

  .shape-2 {
      width: 200px;
      height: 200px;
      top: 60%;
      right: -5%;
      border-radius: 50%;
  }

  .shape-3 {
      width: 150px;
      height: 400px;
      top: 20%;
      right: 20%;
      transform: rotate(-15deg);
      border-radius: 75px;
  }

  /* Circle Elements */
  .parallax-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
      opacity: 0.3;
      z-index: 1;
  }

  .circle-large {
      width: 300px;
      height: 300px;
  }

  .circle-medium {
      width: 200px;
      height: 200px;
  }

  .circle-small {
      width: 100px;
      height: 100px;
  }

  /* Header Content */
  .header-content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
      max-width: 800px;
      padding: 0 2rem;
  }

  .header-content h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .header-divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.5));
      margin: 2rem auto;
      border-radius: 2px;
  }

  .header-content .subheading {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 300;
      opacity: 0.95;
      line-height: 1.4;
  }

  /* Scroll Arrow */
  .scroll-arrow {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      cursor: pointer;
  }

  .arrow-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: bounce 2s ease-in-out infinite;
      transition: background 0.3s ease;
  }

  .arrow-circle:hover {
      background: rgba(255, 255, 255, 0.2);
  }

  .arrow-circle svg {
      stroke: #e2ff55;
      stroke-width: 2;
  }

  /* Content Section */
  .content-section {
      padding: 8rem 0;
      position: relative;
  }

  .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 2rem;
      z-index: 2;
      position: relative;
      color: #374151;
  }

  /* Content Typography */
  .container h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 2rem 0 1.5rem;
      color: #1f2937;
      line-height: 1.3;
  }

  .container h2 {
      font-size: 2rem;
      font-weight: 600;
      margin: 2rem 0 1.25rem;
      color: #1f2937;
      line-height: 1.3;
  }

  .container h3 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 1.75rem 0 1rem;
      color: #1f2937;
      line-height: 1.4;
  }

  .container p {
      font-size: 1.1rem;
      line-height: 1.75;
      color: #4a5568;
      margin-bottom: 1.5rem;
  }

  .container ul,
  .container ol {
      margin: 1.5rem 0;
      padding-left: 2rem;
  }

  .container li {
      margin-bottom: 0.75rem;
      line-height: 1.6;
  }

  .container a {
      color: #6366f1;
      text-decoration: none;
      transition: color 0.2s;
  }

  .container a:hover {
      color: #4f46e5;
      text-decoration: underline;
  }

  .container img {
      max-width: 100%;
      height: auto;
      margin: 2rem 0;
      border-radius: 8px;
  }

  .container blockquote {
      border-left: 4px solid #8b5cf6;
      padding-left: 1.5rem;
      margin: 2rem 0;
      color: #4a5568;
      font-style: italic;
  }

  .container pre {
      background: #f5f5f5;
      padding: 1.5rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 2rem 0;
      font-size: 0.95rem;
      line-height: 1.5;
  }

  .container code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      background: #f5f5f5;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
  }

  /* Floating Shapes */
  .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.2;
      z-index: 1;
  }

  .blue-cyan {
      background: linear-gradient(to right, #60a5fa, #22d3ee);
  }

  .purple-pink {
      background: linear-gradient(to right, #a855f7, #ec4899);
  }

  .indigo-blue {
      background: linear-gradient(to right, #6366f1, #3b82f6);
  }

  .green-emerald {
      background: linear-gradient(to right, #34d399, #10b981);
  }

  .shape-small {
      width: 60px;
      height: 60px;
  }

  .shape-medium {
      width: 120px;
      height: 120px;
  }

  .shape-large {
      width: 200px;
      height: 200px;
  }

  /* Animations */
  @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
  }

  @keyframes float-delayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
  }

  @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
  }

  .animate-float {
      animation: float 6s ease-in-out infinite;
  }

  .animate-float-delayed {
      animation: float-delayed 8s ease-in-out infinite;
  }

  /* Responsive Design */
  @media (max-width: 768px) {
      .parallax-header {
          height: 70vh;
          min-height: 500px;
      }

      .content-section {
          padding: 4rem 0;
      }

      .geometric-shape, .parallax-circle {
          display: none;
      }

      .container {
          padding: 0 1.5rem;
      }

      .container h1 {
          font-size: 2rem;
      }

      .container h2 {
          font-size: 1.75rem;
      }

      .container h3 {
          font-size: 1.5rem;
      }

      .container p {
          font-size: 1rem;
      }
  }
</style>
</head>
<body>
    <!-- Header Section -->
    <header class="parallax-header">
        <div class="parallax-bg rellax" data-rellax-speed="-7"></div>
        
        <!-- Geometric Shapes -->
        <div class="geometric-shape shape-1 rellax animate-float" data-rellax-speed="-3"></div>
        <div class="geometric-shape shape-2 rellax animate-float-delayed" data-rellax-speed="-5"></div>
        <div class="geometric-shape shape-3 rellax animate-float" data-rellax-speed="-2"></div>
        
        <!-- Circle Elements -->
        <div class="parallax-circle circle-large rellax animate-float" data-rellax-speed="-4" style="top: 10%; left: 5%;"></div>
        <div class="parallax-circle circle-medium rellax animate-float-delayed" data-rellax-speed="2" style="top: 60%; right: 10%;"></div>
        <div class="parallax-circle circle-small rellax animate-float" data-rellax-speed="-1" style="bottom: 20%; left: 15%;"></div>
        <div class="parallax-circle circle-medium rellax animate-float-delayed" data-rellax-speed="3" style="top: 30%; right: 20%;"></div>

        <div class="header-content rellax" data-rellax-speed="-4">
            <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
            <div class="header-divider"></div>
            <div class="subheading">{{ page.description }}</div>
        </div>

        <a href="#content" class="scroll-arrow">
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="#e2ff55" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </a>
    </header>

    <!-- Main Section -->
  <!-- Main Content -->
<main class="main-content">
  <!-- Floating parallax elements -->
  <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="2" style="top: 50px; left: 10%;"></div>
  <div class="parallax-element floating-shape shape-medium rellax" data-rellax-speed="-1" style="top: 150px; right: 15%;"></div>
  <div class="parallax-element floating-shape shape-large rellax" data-rellax-speed="3" style="top: 250px; left: 5%;"></div>
  <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="-2" style="top: 350px; right: 10%;"></div>
  <div class="parallax-element floating-shape shape-medium rellax" data-rellax-speed="1" style="top: 450px; left: 20%;"></div>
  <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="2" style="top: 550px; left: 15%;"></div>
  <div class="parallax-element floating-shape shape-large rellax" data-rellax-speed="-3" style="top: 650px; right: 5%;"></div>
  <div class="parallax-element floating-shape shape-medium rellax" data-rellax-speed="1" style="top: 750px; left: 25%;"></div>
  <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="-2" style="top: 850px; right: 20%;"></div>
  <div class="parallax-element floating-shape shape-large rellax" data-rellax-speed="3" style="top: 950px; left: 10%;"></div>
  
  <div class="content-section">
    <div class="container">
      <!-- Content wrapper with parallax -->
      <div class="content-wrapper rellax" data-rellax-speed="-1">
        {{ content }}
      </div>
    </div>
  </div>
</main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize Rellax
            if (typeof Rellax !== 'undefined') {
                var rellax = new Rellax('.rellax', {
                    speed: -7,
                    center: false,
                    wrapper: null,
                    round: true,
                    vertical: true,
                    horizontal: false
                });

                // Refresh Rellax on window resize
                let resizeTimer;
                window.addEventListener('resize', function () {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => rellax.refresh(), 250);
                });
            } else {
                console.error('Rellax.js failed to load.');
            }

            // Smooth scroll behavior for links
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
        });
    </script>
</body>
</html>
