---
layout: default
---

<!-- Vanta Animated Header -->
<header id="vanta-header" style="width: 100%; height: 400px; position: relative; color: white; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center;">
  <div class="container" style="position: relative; z-index: 10;">
    <h1 style="font-size: 4.5rem; margin-bottom: 0.5rem; font-weight: 700;">
      {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
    </h1>
    <hr class="small" style="border-color: rgba(255,255,255,0.6); width: 70px; margin: 1rem auto;">
    <span class="subheading" style="font-size: 1.8rem; color: rgba(255,255,255,0.95); font-weight: 500;">
      {{ page.description }}
    </span>
  </div>
</header>

<!-- Sticky Mini Nav (Hidden by default) -->
<nav id="mini-nav" style="position: fixed; top: 0; left: 0; width: 100%; background: rgba(16,48,11, 0.9); color: white; padding: 0.6rem 1.2rem; z-index: 9999; display: none; align-items: center; justify-content: space-between;">
  <div style="display: flex; align-items: center; gap: 0.75rem;">
    <img src="{{ site.baseurl }}/img/logo.png" alt="Logo" style="height: 30px;">
    <span style="font-size: 1.2rem; font-weight: 600;">{{ site.title }}</span>
  </div>
  <div class="mini-nav-links">
    <a href="{{ site.baseurl }}/" style="color: white; margin: 0 1rem;">Home</a>
    <a href="{{ site.baseurl }}/about" style="color: white; margin: 0 1rem;">About</a>
    <a href="{{ site.baseurl }}/blog" style="color: white; margin: 0 1rem;">Blog</a>
  </div>
</nav>

<!-- Main Content -->
<div class="container">
  <div class="row">
    {{ content }}
  </div>
</div>

<!-- Vanta & Scroll Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
  VANTA.WAVES({
    el: "#vanta-header",
    mouseControls: true,
    touchControls: true,
    minHeight: 400.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x1030b,
    shininess: 50.00,
    waveHeight: 20.00,
    waveSpeed: 1.00,
    zoom: 0.85
  });

  // Show mini-nav after scrolling
  window.addEventListener('scroll', function() {
    const miniNav = document.getElementById('mini-nav');
    if (window.scrollY > 300) {
      miniNav.style.display = 'flex';
    } else {
      miniNav.style.display = 'none';
    }
  });
</script>

<!-- jQuery -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>

<!-- Custom Theme JavaScript -->
<script src="{{ site.baseurl }}/js/main.min.js"></script>
