---
layout: default
---

<style>
  /* GSAP Header Styles with Correct Gradient */
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0a0a2a, #1a1a4a, #2a2a6a);
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 0 20px;
  }

  .header-title {
    font-size: 6.5rem;
    font-weight: 900;
    margin: 0 0 2rem 0;
    line-height: 1;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
    position: relative;
    z-index: 10;
  }

  .description-container {
    display: flex;
    justify-content: center;
    gap: 3rem;
    margin-top: 1rem;
    position: relative;
    z-index: 10;
  }

  .description-item {
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transform: translateY(0);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .description-item:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
  }

  /* Ensure smooth scrolling */
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  #wrapper {
    position: relative;
    overflow: hidden;
  }

  /* Add decorative elements */
  .decoration {
    position: absolute;
    z-index: 1;
  }
  
  .circle {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100, 100, 255, 0.3) 0%, transparent 70%);
    top: 20%;
    left: 15%;
  }
  
  .square {
    width: 150px;
    height: 150px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    bottom: 25%;
    right: 20%;
    transform: rotate(45deg);
  }
</style>

<!-- GSAP Animated Header -->
<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <!-- Decorative elements -->
      <div class="decoration circle"></div>
      <div class="decoration square"></div>
      
      <h1 class="header-title">{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
      
      <div class="description-container">
        <div class="description-item" data-speed="0.95">PROJECTS</div>
        <div class="description-item" data-speed="0.9">BLOG</div>
        <div class="description-item" data-speed="0.85">ABOUT ME</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container" style="margin-bottom: 100px;">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollSmoother.min.js"></script>

<!-- Initialize ScrollSmoother and Parallax Effects -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Initialize ScrollSmoother
    const smoother = ScrollSmoother.create({
      wrapper: "#wrapper",
      content: "#content",
      smooth: 1.5,
      effects: true,
      normalizeScroll: true
    });
    
    // Create parallax effect for description items
    gsap.utils.toArray('.description-item').forEach((item, i) => {
      const speed = parseFloat(item.dataset.speed) || 1;
      
      gsap.to(item, {
        y: (i * 30) - 45,
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>

<!-- Original Scripts -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/main.min.js"></script>
