---
layout: default
---

<style>
  /* GSAP Header Styles with Gradient */
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 0 20px;
  }

  .header-title {
    font-size: 6.5vw;
    font-weight: 900;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
    margin-bottom: 1rem;
    position: relative;
    z-index: 10;
  }

  .description-container {
    position: relative;
    height: 8vw;
    overflow: hidden;
    margin-top: 2rem;
  }

  .description-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    margin: 0;
    font-size: 5.5vw;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px white;
    text-stroke: 2px white;
    opacity: 0.8;
    transform: translateY(0);
    text-transform: uppercase;
  }

  /* Color variations for each line */
  .description-line:nth-child(1) { color: #ff3c78; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(2) { color: #ff6b6b; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(3) { color: #4ecdc4; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(4) { color: #ffe66d; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(5) { color: #ff9a76; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(6) { color: #9b5de5; -webkit-text-stroke: 0; text-stroke: 0; }
  .description-line:nth-child(7) { color: #00bbf9; -webkit-text-stroke: 0; text-stroke: 0; }

  /* Ensure smooth scrolling */
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  #wrapper {
    position: relative;
    overflow: hidden;
  }
</style>

<!-- GSAP Animated Header -->
<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <h1 class="header-title">{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
      
      <div class="description-container">
        <div class="description-line" data-speed="1.0">{{ page.description }}</div>
        <div class="description-line" data-speed="0.95">{{ page.description }}</div>
        <div class="description-line" data-speed="0.9">{{ page.description }}</div>
        <div class="description-line" data-speed="0.85">{{ page.description }}</div>
        <div class="description-line" data-speed="0.8">{{ page.description }}</div>
        <div class="description-line" data-speed="0.75">{{ page.description }}</div>
        <div class="description-line" data-speed="0.7">{{ page.description }}</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container" style="margin-bottom: 100px;">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollSmoother.min.js"></script>

<!-- Initialize ScrollSmoother and Parallax Effects -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Initialize ScrollSmoother
    const smoother = ScrollSmoother.create({
      wrapper: "#wrapper",
      content: "#content",
      smooth: 1.5,
      effects: true,
      normalizeScroll: true
    });
    
    // Create staggered parallax effect
    gsap.utils.toArray('.description-line').forEach((line, i) => {
      const speed = parseFloat(line.dataset.speed) || 1;
      const yOffset = i * 30;
      
      gsap.to(line, {
        y: yOffset,
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>

<!-- Original Scripts -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/main.min.js"></script>
