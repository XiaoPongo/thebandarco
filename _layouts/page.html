<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: #333;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-content {
    flex: 1 0 auto;
    background: transparent;
    z-index: 5;
    padding-bottom: 10rem;
  }

  footer {
    flex-shrink: 0;
    width: 100%;
    position: relative;
    z-index: 10;
    padding: 2rem 0;
    text-align: center;
  }

  .parallax-header {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 1rem;
    text-align: center;
  }

  .parallax-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
    z-index: 1;
  }

  .hexagon-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    opacity: 0.5;
  }

  .hexagon {
    position: absolute;
    width: 100px;
    height: 57.74px;
    background-color: rgba(255, 255, 255, 0.15);
    animation: hexPulse 8s ease-in-out infinite;
  }

  .hexagon::before, .hexagon::after {
    content: "";
    position: absolute;
    width: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
  }

  .hexagon::before {
    bottom: 100%;
    border-bottom: 28.87px solid rgba(255, 255, 255, 0.15);
  }

  .hexagon::after {
    top: 100%;
    border-top: 28.87px solid rgba(255, 255, 255, 0.15);
  }

  @keyframes hexPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }

  .header-box {
    position: relative;
    z-index: 2;
    background-color: rgba(255, 255, 255, 0.07);
    padding: 2.5rem 4rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    animation: breathe 5s ease-in-out infinite;
    backdrop-filter: blur(12px);
    max-width: 90%;
    color: white;
  }

  .header-box h1 {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 800;
    margin-bottom: 1rem;
    color: white;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .header-divider {
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.5));
    margin: 2rem auto;
    border-radius: 2px;
  }

  .subheading {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 300;
    opacity: 0.95;
    line-height: 1.4;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.02); opacity: 0.95; }
  }

  .scroll-indicator {
    position: relative;
    z-index: 10;
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: breathe 5s ease-in-out infinite;
  }

  .scroll-indicator p {
    color: white;
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }

  .arrow-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: arrowPulse 3s ease-in-out infinite;
    cursor: pointer;
  }

  .arrow-circle svg {
    stroke: #e2ff55;
  }

  @keyframes arrowPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  .content-section {
    padding: 10rem 2rem;
    position: relative;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .content-wrapper {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 4rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    margin: 2rem 0;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .content-wrapper h2 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 2rem;
    color: #2d3748;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .content-wrapper p {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #4a5568;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 768px) {
    .parallax-header {
      height: 80vh;
    }

    .header-box {
      padding: 2rem;
    }

    .content-section {
      padding: 4rem 1.5rem;
    }

    .content-wrapper {
      padding: 2rem;
    }
  }
</style>

<header class="parallax-header">
  <div class="hexagon-grid">
    <!-- Hexagon elements will be added dynamically -->
  </div>
  
  <div class="header-box">
    <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
    <div class="header-divider"></div>
    <div class="subheading">{{ page.description }}</div>
  </div>

  <a href="#content" class="scroll-indicator">
    <p>Scroll to explore</p>
    <div class="arrow-circle">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke="#e2ff55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </a>
</header>

<main class="main-content">
  <div class="content-section" id="content">
    <div class="container">
      <div class="content-wrapper">
        {{ content }}
      </div>
    </div>
  </div>
</main>

<!-- Optional Scripts -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Create hexagon grid
    const hexGrid = document.querySelector('.hexagon-grid');
    const hexSize = 100;
    const hexHeight = Math.sqrt(3) * hexSize / 2;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    
    const cols = Math.ceil(viewportWidth / (hexSize * 1.5)) + 1;
    const rows = Math.ceil(viewportHeight / hexHeight) + 1;
    
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const hex = document.createElement('div');
        hex.className = 'hexagon';
        
        const x = col * hexSize * 1.5;
        const y = row * hexHeight;
        
        // Offset every other column
        if (col % 2 === 1) {
          hex.style.top = `${y + hexHeight / 2}px`;
        } else {
          hex.style.top = `${y}px`;
        }
        
        hex.style.left = `${x}px`;
        
        // Randomize animation delay for a more organic feel
        hex.style.animationDelay = `${Math.random() * 5}s`;
        
        hexGrid.appendChild(hex);
      }
    }

    // Smooth scrolling for anchor links
    const links = document.querySelectorAll('a[href^="#"]');
    links.forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  });
</script>
