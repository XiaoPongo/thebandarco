---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        /* Complete Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height for mobile */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9fafb;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Main Container */
        .page-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Parallax Header - Optimized for all devices */
        .parallax-header {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height */
            min-height: 600px; /* Minimum height for very small screens */
            background: linear-gradient(135deg, #020024 0%, #090979 35%, #bb00ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            /* Safe area padding for notched devices */
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Gradient Overlay for Smooth Blending */
        .gradient-overlay {
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, transparent 0%, rgba(249, 250, 251, 0.1) 20%, rgba(249, 250, 251, 0.5) 60%, #f9fafb 100%);
            z-index: 50;
            pointer-events: none;
        }

        /* Enhanced Geometric Shapes */
        .geometric-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            z-index: 1;
            will-change: transform;
        }

        .shape-1 {
            width: min(180px, 15vw);
            height: min(180px, 15vw);
            top: 12%;
            left: -3%;
            transform: rotate(45deg);
            animation: float 8s ease-in-out infinite;
        }

        .shape-2 {
            width: min(130px, 12vw);
            height: min(130px, 12vw);
            top: 45%;
            right: -2%;
            border-radius: 50%;
            animation: float-delayed 10s ease-in-out infinite;
        }

        .shape-3 {
            width: min(100px, 8vw);
            height: min(250px, 20vw);
            top: 20%;
            right: 12%;
            transform: rotate(-15deg);
            border-radius: 50px;
            animation: float 9s ease-in-out infinite;
        }

        /* Floating Circles */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 70%);
            opacity: 0.4;
            animation: float-delayed 12s ease-in-out infinite;
            z-index: 1;
            will-change: transform;
        }

        .circle-large {
            width: min(220px, 18vw);
            height: min(220px, 18vw);
            top: 10%;
            left: 3%;
        }

        .circle-medium {
            width: min(130px, 11vw);
            height: min(130px, 11vw);
            top: 55%;
            right: 8%;
        }

        .circle-small {
            width: min(70px, 6vw);
            height: min(70px, 6vw);
            bottom: 20%;
            left: 12%;
        }

        .circle-extra {
            width: min(160px, 13vw);
            height: min(160px, 13vw);
            top: 30%;
            right: 22%;
        }

        /* Enhanced Glow Ring */
        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(350px, 40vw);
            height: min(350px, 40vw);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(187, 0, 255, 0.2) 40%, transparent 70%);
            animation: pulse-ring 8s ease-in-out infinite;
            filter: blur(40px);
            z-index: 2;
        }

        /* Optimized Header Content */
        .header-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: min(900px, 90vw);
            padding: 0 clamp(1rem, 5vw, 2rem);
            margin-top: -5vh; /* Better vertical centering */
        }

        .header-content h1 {
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            font-weight: 800;
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
            word-break: break-word;
            hyphens: auto;
        }

        .header-divider {
            width: min(100px, 20vw);
            height: 3px;
            background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.4));
            margin: clamp(1.5rem, 4vw, 2rem) auto;
            border-radius: 2px;
        }

        .subheading {
            font-size: clamp(1.1rem, 2.8vw, 1.8rem);
            font-weight: 300;
            opacity: 0.92;
            line-height: 1.4;
            animation: fadeInUp 2s ease-out forwards;
            max-width: 80%;
            margin: 0 auto;
        }

        /* Enhanced Scroll Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            cursor: pointer;
            text-decoration: none;
        }

        .arrow-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bounce 2.5s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .arrow-circle:hover,
        .arrow-circle:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }

        .arrow-circle svg {
            stroke: #90ee90;
            stroke-width: 2.5;
        }

        /* Content Section with Parallax Blend */
        .content-section {
            position: relative;
            width: 100%;
            background: #f9fafb;
            padding: clamp(3rem, 8vw, 6rem) 0 clamp(2rem, 5vw, 4rem) 0;
            z-index: 100;
            flex: 1 0 auto;
            /* Smooth blend effect */
            margin-top: -100px;
            padding-top: 120px;
        }

        .content-wrapper {
            max-width: min(1200px, 95vw);
            margin: 0 auto;
            padding: 0 clamp(1rem, 4vw, 2rem);
            position: relative;
            z-index: 100;
        }

        /* Enhanced Content Styling */
        .content-wrapper h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #1f2937;
            margin: clamp(1.5rem, 4vw, 2rem) 0 clamp(1rem, 3vw, 1.5rem) 0;
            line-height: 1.25;
            position: relative;
            z-index: 100;
        }

        .content-wrapper h2 {
            font-size: clamp(1.75rem, 4vw, 2rem);
            font-weight: 700;
            color: #1f2937;
            margin: clamp(1.5rem, 4vw, 2rem) 0 clamp(1rem, 2.5vw, 1.25rem) 0;
            line-height: 1.3;
            position: relative;
            z-index: 100;
        }

        .content-wrapper h3 {
            font-size: clamp(1.5rem, 3.5vw, 1.75rem);
            font-weight: 600;
            color: #1f2937;
            margin: clamp(1.25rem, 3vw, 1.5rem) 0 clamp(0.75rem, 2vw, 1rem) 0;
            line-height: 1.3;
            position: relative;
            z-index: 100;
        }

        .content-wrapper p {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: clamp(1rem, 3vw, 1.5rem);
            position: relative;
            z-index: 100;
        }

        .content-wrapper ul,
        .content-wrapper ol {
            margin: clamp(1rem, 3vw, 1.5rem) 0;
            padding-left: clamp(1.5rem, 4vw, 2rem);
            position: relative;
            z-index: 100;
        }

        .content-wrapper li {
            margin-bottom: clamp(0.5rem, 1.5vw, 0.75rem);
            line-height: 1.6;
            color: #4a5568;
            position: relative;
            z-index: 100;
        }

        .content-wrapper img {
            max-width: 100%;
            height: auto;
            margin: clamp(1.5rem, 4vw, 2rem) 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .content-wrapper blockquote {
            border-left: 4px solid #8b5cf6;
            padding-left: clamp(1rem, 3vw, 1.5rem);
            margin: clamp(1.5rem, 4vw, 2rem) 0;
            color: #4a5568;
            font-style: italic;
            background: rgba(139, 92, 246, 0.05);
            padding: clamp(1rem, 3vw, 1.5rem);
            border-radius: 8px;
            position: relative;
            z-index: 100;
        }

        .content-wrapper code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: #e53e3e;
            position: relative;
            z-index: 100;
        }

        .content-wrapper pre {
            overflow-x: auto;
            background: #1a202c;
            color: #e2e8f0;
            padding: clamp(1rem, 3vw, 1.5rem);
            border-radius: 12px;
            margin: clamp(1.5rem, 4vw, 2rem) 0;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            line-height: 1.5;
            border-left: 4px solid #667eea;
            position: relative;
            z-index: 100;
        }

        .content-wrapper pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
        }

        /* Interactive Elements */
        .content-wrapper .card,
        .content-wrapper .project-card,
        .content-wrapper .portfolio-item,
        .content-wrapper .button,
        .content-wrapper .btn,
        .content-wrapper a[class*="button"],
        .content-wrapper a[class*="btn"],
        .content-wrapper [class*="card"] {
            position: relative;
            z-index: 200 !important;
        }

        /* Subtle Background Elements */
        .floating-bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.04;
            z-index: -5 !important;
            animation: float 15s ease-in-out infinite;
            pointer-events: none;
            will-change: transform;
        }

        .bg-shape-1 {
            width: min(80px, 8vw);
            height: min(80px, 8vw);
            background: linear-gradient(45deg, #60a5fa, #22d3ee);
            top: 15%;
            left: 8%;
        }

        .bg-shape-2 {
            width: min(120px, 12vw);
            height: min(120px, 12vw);
            background: linear-gradient(45deg, #a855f7, #ec4899);
            top: 45%;
            right: 10%;
            animation-delay: -3s;
        }

        .bg-shape-3 {
            width: min(60px, 6vw);
            height: min(60px, 6vw);
            background: linear-gradient(45deg, #34d399, #10b981);
            top: 75%;
            left: 15%;
            animation-delay: -6s;
        }

        .bg-shape-4 {
            width: min(100px, 10vw);
            height: min(100px, 10vw);
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 30%;
            right: 25%;
            animation-delay: -2s;
        }

        .bg-shape-5 {
            width: min(70px, 7vw);
            height: min(70px, 7vw);
            background: linear-gradient(45deg, #ef4444, #dc2626);
            top: 65%;
            left: 30%;
            animation-delay: -4s;
        }

        /* Footer with safe area support */
        footer {
            margin: 0 !important;
            padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 4vw, 2rem) max(1rem, env(safe-area-inset-bottom, 1rem)) !important;
            width: 100%;
            min-height: max(60px, calc(60px + env(safe-area-inset-bottom)));
            flex-shrink: 0;
            z-index: 100;
            background: #f9fafb;
        }

        /* Enhanced Animations */
        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            33% { 
                transform: translateY(-15px) rotate(120deg); 
            }
            66% { 
                transform: translateY(-8px) rotate(240deg); 
            }
        }

        @keyframes float-delayed {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            50% { 
                transform: translateY(-12px) rotate(180deg); 
            }
        }

        @keyframes bounce {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-6px); 
            }
        }

        @keyframes pulse-ring {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.6;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 0.92;
            }
        }

        /* Mobile-Specific Optimizations */
        @media (max-width: 768px) {
            .parallax-header {
                min-height: max(600px, 100dvh);
                padding-bottom: max(40px, env(safe-area-inset-bottom, 20px));
            }

            .header-content {
                margin-top: -8vh;
                max-width: 95vw;
            }

            .geometric-shape {
                opacity: 0.6;
            }

            .floating-circle {
                opacity: 0.3;
            }

            .content-section {
                margin-top: -80px;
                padding-top: 100px;
            }

            .floating-bg-shape {
                opacity: 0.02;
            }
        }

        @media (max-width: 480px) {
            .parallax-header {
                min-height: max(550px, 100dvh);
                padding-bottom: max(30px, env(safe-area-inset-bottom, 15px));
            }

            .header-content h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
                margin-bottom: 1rem;
            }

            .subheading {
                font-size: clamp(1rem, 3.5vw, 1.3rem);
                max-width: 90%;
            }

            .content-section {
                margin-top: -60px;
                padding-top: 80px;
                padding-bottom: 1.5rem;
            }

            .geometric-shape,
            .floating-circle {
                opacity: 0.4;
            }

            .floating-bg-shape {
                display: none;
            }

            .arrow-circle {
                width: 44px;
                height: 44px;
            }
        }

        /* Landscape mobile orientation */
        @media (max-height: 500px) and (orientation: landscape) {
            .parallax-header {
                height: 100vh;
                min-height: 100vh;
                padding-top: max(env(safe-area-inset-top), 10px);
                padding-bottom: max(env(safe-area-inset-bottom), 10px);
            }

            .header-content {
                margin-top: -2vh;
                padding: 0 clamp(1rem, 8vw, 3rem);
            }

            .header-content h1 {
                font-size: clamp(2rem, 6vw, 3.5rem);
                margin-bottom: 0.75rem;
            }

            .subheading {
                font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            }

            .scroll-arrow {
                bottom: max(15px, env(safe-area-inset-bottom, 10px));
            }

            .geometric-shape,
            .floating-circle {
                opacity: 0.3;
            }
        }

        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .header-content h1 {
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .geometric-shape,
            .floating-circle,
            .glow-ring,
            .floating-bg-shape,
            .arrow-circle {
                animation: none;
            }

            .subheading {
                animation: none;
                opacity: 0.92;
            }

            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Enhanced Header Section -->
        <header class="parallax-header">
            <!-- Geometric Shapes with Parallax -->
            <div class="geometric-shape shape-1 rellax" data-rellax-speed="-2"></div>
            <div class="geometric-shape shape-2 rellax" data-rellax-speed="-4"></div>
            <div class="geometric-shape shape-3 rellax" data-rellax-speed="-1"></div>

            <!-- Floating Circles with Parallax -->
            <div class="floating-circle circle-large rellax" data-rellax-speed="-3"></div>
            <div class="floating-circle circle-medium rellax" data-rellax-speed="1"></div>
            <div class="floating-circle circle-small rellax" data-rellax-speed="-1"></div>
            <div class="floating-circle circle-extra rellax" data-rellax-speed="2"></div>

            <!-- Enhanced Glow Ring -->
            <div class="glow-ring rellax" data-rellax-speed="-1"></div>

            <!-- Optimized Header Content -->
            <div class="header-content rellax" data-rellax-speed="-1">
                <h1>{{ page.title | default: site.title | default: "Projects" }}</h1>
                <div class="header-divider"></div>
                <div class="subheading">{{ page.description | default: "Discover amazing projects and ideas" }}</div>
            </div>

            <!-- Enhanced Scroll Arrow -->
            <a href="#content" class="scroll-arrow">
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2.5">
                        <path d="M12 5v14M12 19l-6-6M12 19l6-6"/>
                    </svg>
                </div>
            </a>

            <!-- Gradient Overlay for Smooth Blending -->
            <div class="gradient-overlay rellax" data-rellax-speed="3"></div>
        </header>

        <!-- Main Content Section with Parallax Blend -->
        <main id="content" class="content-section">
            <!-- Subtle Background Shapes -->
            <div class="floating-bg-shape bg-shape-1 rellax" data-rellax-speed="0.5"></div>
            <div class="floating-bg-shape bg-shape-2 rellax" data-rellax-speed="-0.5"></div>
            <div class="floating-bg-shape bg-shape-3 rellax" data-rellax-speed="1"></div>
            <div class="floating-bg-shape bg-shape-4 rellax" data-rellax-speed="-1"></div>
            <div class="floating-bg-shape bg-shape-5 rellax" data-rellax-speed="0.8"></div>

            <!-- Content Wrapper -->
            {% unless page.skip_container %}
            <div class="content-wrapper">
            {% else %}
            <div class="content-wrapper" style="max-width: 100%; padding: 0;">
            {% endunless %}

                {{ content }}

            </div>
        </main>

        <!-- Optimized Footer -->
        <footer></footer>
    </div>

    <!-- Rellax Parallax Library -->
    <script src="https://cdn.jsdelivr.net/gh/dixonandmoe/rellax@master/rellax.min.js"></script>
    
    <!-- Enhanced Parallax and Interaction Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Enhanced Rellax Parallax
            if (typeof Rellax !== 'undefined') {
                var rellax = new Rellax('.rellax', {
                    speed: -5,
                    center: false,
                    wrapper: null,
                    round: true,
                    vertical: true,
                    horizontal: false
                });

                // Enhanced resize handling with debouncing
                let resizeTimer;
                let isResizing = false;
                
                window.addEventListener('resize', function() {
                    if (!isResizing) {
                        isResizing = true;
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(() => {
                            rellax.refresh();
                            isResizing = false;
                        }, 150);
                    }
                });

                // Orientation change handling for mobile
                window.addEventListener('orientationchange', function() {
                    setTimeout(() => {
                        rellax.refresh();
                    }, 300);
                });
            }

            // Enhanced smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        const headerOffset = 0;
                        const elementPosition = target.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            // Enhanced intersection observer for content animations
            const observerOptions = {
                threshold: 0.08,
                rootMargin: '0px 0px -30px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.style.opacity = '1';
                            entry.target.style.transform = 'translateY(0)';
                        }, index * 100); // Staggered animation
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // Observe content elements for enhanced fade-in effect
            document.querySelectorAll('.content-wrapper > *').forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(15px)';
                el.style.transition = `opacity 0.8s ease ${index * 0.1}s, transform 0.8s ease ${index * 0.1}s`;
                observer.observe(el);
            });

            // Enhanced scroll-based gradient blending
            let ticking = false;
            
            function updateBlending() {
                const scrolled = window.pageYOffset;
                const rate = scrolled * -0.5;
                const gradientOverlay = document.querySelector('.gradient-overlay');
                
                if (gradientOverlay) {
                    gradientOverlay.style.transform = `translateY(${rate}px)`;
                }
                
                ticking = false;
            }

            window.addEventListener('scroll', function() {
                if (!ticking) {
                    requestAnimationFrame(updateBlending);
                    ticking = true;
                }
            });

            // Touch and gesture optimization for mobile
            let touchStartY = 0;
            let touchEndY = 0;

            document.addEventListener('touchstart', function(e) {
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                touchEndY = e.changedTouches[0].screenY;
                handleGesture();
            }, { passive: true });

            function handleGesture() {
                const swipeThreshold = 50;
                const swipeLength = touchEndY - touchStartY;
                
                if (Math.abs(swipeLength) > swipeThreshold) {
                    // Optional: Add swipe-based navigation or effects
                }
            }

            // Performance optimization for mobile
            if (window.innerWidth <= 768) {
                // Reduce animation complexity on mobile
                document.querySelectorAll('.geometric-shape, .floating-circle').forEach(el => {
                    el.style.animationDuration = '12s';
                });
            }

            // iOS Safari specific optimizations
            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                document.body.style.minHeight = '100vh';
                document.body.style.minHeight = '100dvh';
                
                // Handle iOS Safari bottom bar
                const updateViewportHeight = () => {
                    document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
                };
                
                window.addEventListener('resize', updateViewportHeight);
                updateViewportHeight();
            }
        });
    </script>
</body>
</html>
