<style>
  /* Updated Header Styles */
  .parallax-header {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: white;
  }
  
  .header-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://www.invesco.com/us/media/images/qqq/ncaa/hero-bg.jpg') center/cover no-repeat;
    will-change: transform;
  }
  
  .header-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 1200px;
    padding: 0 2rem;
    margin-top: -100px;
  }
  
  .header-content h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 700;
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-transform: uppercase;
  }
  
  .scroll-indicator {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  
  .scroll-indicator:after {
    content: "↓";
    display: block;
    margin-top: 10px;
    font-size: 1.5rem;
    animation: bounce 2s infinite;
  }
  
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
    40% {transform: translateY(-10px);}
    60% {transform: translateY(-5px);}
  }
</style>

<!-- Parallax Header -->
<header class="parallax-header">
  <!-- Background image with parallax -->
  <div class="header-background rellax" data-rellax-speed="-3"></div>
  
  <!-- Header content -->
  <div class="header-content rellax" data-rellax-speed="-1">
    <h1>YOUR COURTSIDE SEAT TO INNOVATION</h1>
    <div class="scroll-indicator">SCROLL TO EXPLORE</div>
  </div>
</header>

<!-- Rellax.js -->
<script src="https://cdn.jsdelivr.net/gh/dixonandmoe/rellax@master/rellax.min.js"></script>
<script>
  // Initialize Rellax with stronger effect
  var rellax = new Rellax('.rellax', {
    speed: -5,
    center: true,
    wrapper: null,
    round: true,
    vertical: true,
    horizontal: false
  });
  
  // Additional scroll effects
  document.addEventListener('DOMContentLoaded', function() {
    const header = document.querySelector('.parallax-header');
    const headerBg = document.querySelector('.header-background');
    
    function handleScroll() {
      const scrollY = window.scrollY;
      const headerHeight = header.offsetHeight;
      
      // Scale background on scroll
      if (scrollY < headerHeight) {
        const scale = 1 + (scrollY * 0.002);
        headerBg.style.transform = `scale(${scale})`;
        headerBg.style.opacity = 1 - (scrollY / headerHeight);
      }
    }
    
    window.addEventListener('scroll', handleScroll);
  });
</script>
