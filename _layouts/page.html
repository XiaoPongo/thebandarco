---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
  }

  /* Squiggly background with alternating pattern */
  .gsap-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%230ff' fill-opacity='0.25'%3E%3Cpath d='M10 10 Q15 0 20 10 T30 10' /%3E%3Cpath d='M50 10 Q45 0 40 10 T30 10' /%3E%3Cpath d='M10 40 Q0 35 10 30 T10 10' /%3E%3Cpath d='M50 40 Q60 35 50 30 T50 10' /%3E%3Cpath d='M10 70 Q15 60 20 70 T30 70' /%3E%3Cpath d='M50 70 Q45 60 40 70 T30 70' /%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
    opacity: 0.2;
    z-index: 0;
    animation: bgMove 30s linear infinite;
  }

  @keyframes bgMove {
    0% { background-position: 0 0; }
    100% { background-position: 80px 80px; }
  }

  /* Header content container */
  .header-content {
    position: relative;
    z-index: 2;
    transform: translateY(-15%); /* Move content above center */
    margin-bottom: 60px; /* Space for arrow */
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3), 
                 0 0 20px rgba(110, 0, 255, 0.5);
    padding: 20px 40px;
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Description wrapper positioned where arrow was */
  .description-wrapper {
    position: absolute;
    bottom: 100px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 3;
  }

  .description-layer {
    position: absolute;
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #FF6200;
    white-space: nowrap;
    mix-blend-mode: lighten;
    pointer-events: none;
    text-shadow: 0 0 5px rgba(255, 98, 0, 0.5);
  }

  /* Layer opacity */
  .description-layer:nth-child(1) { opacity: 1; }
  .description-layer:nth-child(2) { opacity: 0.8; }
  .description-layer:nth-child(3) { opacity: 0.6; }
  .description-layer:nth-child(4) { opacity: 0.4; }
  .description-layer:nth-child(5) { opacity: 0.2; }

  /* Scroll Arrow - new styling */
  .scroll-arrow {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    cursor: pointer;
  }

  .arrow-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: bounce 2s ease-in-out infinite;
    transition: background 0.3s ease;
  }

  .arrow-circle:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .arrow-circle svg {
    stroke: #e2ff55;
    stroke-width: 2;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* Mobile responsiveness */
  @media screen and (max-width: 768px) {
    .header-title {
      font-size: 12vw;
      padding: 15px 30px;
    }
    
    .description-layer {
      font-size: 5vw;
      white-space: normal;
      text-align: center;
      bottom: 80px; /* Adjust for mobile */
    }
    
    .scroll-arrow {
      bottom: 20px; /* More visible on mobile */
    }
  }

  /* Maintain existing layout styles */
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <!-- Header content moved above center -->
      <div class="header-content">
        <h1 class="header-title">
          {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
        </h1>
      </div>

      <!-- Description moved to where arrow was -->
      <div class="description-wrapper">
        <div class="description-layer" data-depth="1">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
      </div>

      <!-- Scroll arrow now in place of description -->
      <div class="scroll-arrow">
        <div class="arrow-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 15L12 8L19 15" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Main Content (unchanged) -->
    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger);

    const layers = gsap.utils.toArray(".description-layer");

    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: `${(1 - depth) * 100}px`,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });

    // Scroll arrow click handler
    document.querySelector('.scroll-arrow').addEventListener('click', function() {
      gsap.to(window, {
        duration: 1.5,
        scrollTo: ".container",
        ease: "power2.inOut"
      });
    });
  });
</script>
