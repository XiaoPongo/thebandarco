---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
    background: none;
  }

  /* Animated gradient background */
  .gsap-header::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background: linear-gradient(135deg, 
      #051233, 
      #2d0c6e, 
      #6e00ff, 
      #7209b7, 
      #4a0080);
    background-size: 200% 200%;
    animation: gradientBreath 12s ease infinite;
    z-index: 0; /* Background layer */
  }

  /* Semi-transparent overlay for better text contrast */
  .gsap-header::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 18, 51, 0.4);
    z-index: 1; /* Between gradient and content */
  }

  @keyframes gradientBreath {
    0% {
      transform: translate(-10%, -10%) rotate(0deg);
      background-position: 0% 0%;
    }
    25% {
      transform: translate(-15%, -5%) rotate(1deg);
      background-position: 25% 25%;
    }
    50% {
      transform: translate(-10%, -10%) rotate(0deg);
      background-position: 100% 100%;
    }
    75% {
      transform: translate(-5%, -15%) rotate(-1deg);
      background-position: 75% 75%;
    }
    100% {
      transform: translate(-10%, -10%) rotate(0deg);
      background-position: 0% 0%;
    }
  }

  .header-content {
    position: relative;
    z-index: 3; /* Increased to be above overlay */
    margin-bottom: 40px;
    opacity: 0; /* Prevent flash before animation */
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    padding: 20px 40px;
    background: rgba(0,0,0,0.3); /* Darker background for better contrast */
    border-radius: 15px;
    backdrop-filter: blur(8px); /* Stronger blur */
    border: 1px solid rgba(255,255,255,0.2);
    transition: transform 0.3s ease;
    position: relative; /* Ensure it stays above */
    z-index: 4; /* Higher than content wrapper */
  }

  .header-title:hover {
    transform: scale(1.02);
  }

  .description-wrapper {
    position: relative;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    z-index: 3; /* Above overlay */
  }

  .description-layer {
    position: relative; /* Changed to relative for proper stacking */
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #FF6200;
    white-space: nowrap;
    mix-blend-mode: lighten;
    pointer-events: none;
    /* Enhanced white outline */
    text-shadow: 
      -1.5px -1.5px 0 #fff, 
      1.5px -1.5px 0 #fff,
      -1.5px 1.5px 0 #fff, 
      1.5px 1.5px 0 #fff,
      0 0 8px rgba(0,0,0,0.5); /* Added glow for better separation */
    z-index: 4; /* Higher than title */
  }

  .description-layer:nth-child(1) { opacity: 1; }
  .description-layer:nth-child(2) { opacity: 0.8; }
  .description-layer:nth-child(3) { opacity: 0.6; }
  .description-layer:nth-child(4) { opacity: 0.4; }
  .description-layer:nth-child(5) { opacity: 0.2; }

  .scroll-arrow {
    position: absolute;
    bottom: 30px; /* Fixed position from bottom */
    left: 50%;
    transform: translateX(-50%);
    z-index: 10; /* Highest priority */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .arrow-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: bounce 2s ease-in-out infinite;
    transition: background 0.3s ease;
  }

  .arrow-circle:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  .arrow-circle svg {
    stroke: #59e659;
    stroke-width: 2;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Responsive mobile */
  @media screen and (max-width: 768px) {
    .header-title {
      font-size: 12vw;
      padding: 15px 30px;
    }

    .description-layer {
      font-size: 5vw;
      white-space: normal;
      text-align: center;
    }

    .scroll-arrow {
      position: fixed;
      bottom: 30px;
      top: auto;
    }
  }
</style>

<!-- HTML structure -->
<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <!-- Background layers at z-index 0-1 -->
      
      <div class="header-content">
        <h1 class="header-title">
          {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
        </h1>

        <div class="description-wrapper">
          <!-- Description layers at z-index 4 -->
          <div class="description-layer" data-depth="1">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
        </div>
      </div>
      
      <!-- Scroll arrow at z-index 10 -->
      <div class="scroll-arrow">
        <div class="arrow-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 10L12 17L19 10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

    // Initialize animations
    gsap.from(".header-content", {
      y: 40,
      opacity: 0,
      duration: 1,
      ease: "power2.out",
      delay: 0.3
    });

    gsap.from(".description-layer", {
      opacity: 0,
      y: 20,
      stagger: 0.1,
      delay: 0.5,
      duration: 0.6,
      ease: "power1.out"
    });

    // Parallax effect for description layers
    const layers = gsap.utils.toArray(".description-layer");
    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: (1 - depth) * 50,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });

    // Scroll to content
    document.querySelector('.scroll-arrow').addEventListener('click', function () {
      gsap.to(window, {
        duration: 0.6,
        scrollTo: ".container",
        ease: "power1.out"
      });
    });
  });
</script>
