---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        /* Complete Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* Global Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9fafb;
            scroll-behavior: smooth;
        }

        /* Main Container */
        .page-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            background: #f9fafb;
        }

        /* Parallax Header */
        .parallax-header {
            position: relative;
            width: 100%;
            height: 70vh;
            min-height: 500px;
            background: linear-gradient(135deg, #020024 0%, #090979 35%, #bb00ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Geometric Shapes */
        .geometric-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            z-index: 1;
        }

        .shape-1 {
            width: 200px;
            height: 200px;
            top: 15%;
            left: -5%;
            transform: rotate(45deg);
            animation: float 6s ease-in-out infinite;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: -3%;
            border-radius: 50%;
            animation: float-delayed 8s ease-in-out infinite;
        }

        .shape-3 {
            width: 120px;
            height: 300px;
            top: 25%;
            right: 15%;
            transform: rotate(-15deg);
            border-radius: 60px;
            animation: float 6s ease-in-out infinite;
        }

        /* Floating Circles */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0.3;
            animation: float-delayed 8s ease-in-out infinite;
            z-index: 1;
        }

        .circle-large {
            width: 250px;
            height: 250px;
            top: 15%;
            left: 5%;
        }

        .circle-medium {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
        }

        .circle-small {
            width: 80px;
            height: 80px;
            bottom: 15%;
            left: 15%;
        }

        /* Glow Ring */
        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(187, 0, 255, 0.3) 40%, transparent 70%);
            animation: pulse-ring 6s ease-in-out infinite;
            filter: blur(60px);
            z-index: 2;
        }

        /* Header Content */
        .header-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 900px;
            padding: 0 2rem;
        }

        .header-content h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-divider {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.5));
            margin: 2rem auto;
            border-radius: 2px;
        }

        .subheading {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 300;
            opacity: 0.95;
            line-height: 1.4;
            animation: fadeInUp 1.8s ease-in-out forwards;
        }

        /* Scroll Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            cursor: pointer;
            text-decoration: none;
        }

        .arrow-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bounce 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .arrow-circle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Content Section */
        .content-section {
            position: relative;
            width: 100%;
            background: #f9fafb;
            padding: 4rem 0;
            z-index: 100;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 100;
        }

        /* Content Styling */
        .content-wrapper h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1f2937;
            margin: 2rem 0 1.5rem 0;
            line-height: 1.3;
            position: relative;
            z-index: 100;
        }

        .content-wrapper h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin: 2rem 0 1.25rem 0;
            line-height: 1.3;
            position: relative;
            z-index: 100;
        }

        .content-wrapper h3 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1f2937;
            margin: 1.5rem 0 1rem 0;
            line-height: 1.3;
            position: relative;
            z-index: 100;
        }

        .content-wrapper p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 100;
        }

        .content-wrapper ul,
        .content-wrapper ol {
            margin: 1.5rem 0;
            padding-left: 2rem;
            position: relative;
            z-index: 100;
        }

        .content-wrapper li {
            margin-bottom: 0.75rem;
            line-height: 1.6;
            color: #4a5568;
            position: relative;
            z-index: 100;
        }

        .content-wrapper img {
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .content-wrapper blockquote {
            border-left: 4px solid #8b5cf6;
            padding-left: 1.5rem;
            margin: 2rem 0;
            color: #4a5568;
            font-style: italic;
            background: rgba(139, 92, 246, 0.05);
            padding: 1.5rem;
            border-radius: 8px;
            position: relative;
            z-index: 100;
        }

        .content-wrapper code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: #e53e3e;
            position: relative;
            z-index: 100;
        }

        .content-wrapper pre {
            overflow-x: auto;
            background: #1a202c;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 12px;
            margin: 2rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
            border-left: 4px solid #667eea;
            position: relative;
            z-index: 100;
        }

        .content-wrapper pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
        }

        /* Cards and Interactive Elements */
        .content-wrapper .card,
        .content-wrapper .project-card,
        .content-wrapper .portfolio-item,
        .content-wrapper .button,
        .content-wrapper .btn,
        .content-wrapper a[class*="button"],
        .content-wrapper a[class*="btn"],
        .content-wrapper [class*="card"] {
            position: relative;
            z-index: 200 !important;
        }

        /* Floating Background Elements - LOWEST Z-INDEX */
        .floating-bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            z-index: -10 !important;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .bg-shape-1 {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #60a5fa, #22d3ee);
            top: 10%;
            left: 5%;
        }

        .bg-shape-2 {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            top: 40%;
            right: 8%;
            animation-delay: -2s;
        }

        .bg-shape-3 {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #34d399, #10b981);
            top: 70%;
            left: 10%;
            animation-delay: -4s;
        }

        .bg-shape-4 {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 25%;
            right: 20%;
            animation-delay: -1s;
        }

        .bg-shape-5 {
            width: 90px;
            height: 90px;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            top: 60%;
            left: 25%;
            animation-delay: -3s;
        }

        /* Ensure all content elements are above background shapes */
        .content-wrapper > * {
            position: relative;
            z-index: 100;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes float-delayed {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(90deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse-ring {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 0.95;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .parallax-header {
                height: 60vh;
                min-height: 400px;
            }

            .geometric-shape,
            .floating-circle {
                display: none;
            }

            .header-content {
                padding: 0 1rem;
            }

            .content-wrapper {
                padding: 0 1rem;
            }

            .content-wrapper h1 {
                font-size: 2rem;
            }

            .content-wrapper h2 {
                font-size: 1.75rem;
            }

            .content-wrapper h3 {
                font-size: 1.5rem;
            }

            .floating-bg-shape {
                opacity: 0.05;
            }
        }

        @media (max-width: 480px) {
            .parallax-header {
                height: 50vh;
                min-height: 350px;
            }

            .content-section {
                padding: 2rem 0;
            }

            .floating-bg-shape {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header Section -->
        <header class="parallax-header">
            <!-- Geometric Shapes -->
            <div class="geometric-shape shape-1"></div>
            <div class="geometric-shape shape-2"></div>
            <div class="geometric-shape shape-3"></div>

            <!-- Floating Circles -->
            <div class="floating-circle circle-large"></div>
            <div class="floating-circle circle-medium"></div>
            <div class="floating-circle circle-small"></div>

            <!-- Glow Ring -->
            <div class="glow-ring"></div>

            <!-- Header Content -->
            <div class="header-content">
                <h1>{{ page.title | default: site.title | default: "Projects" }}</h1>
                <div class="header-divider"></div>
                <div class="subheading">{{ page.description | default: "Beautiful web experiences crafted with passion" }}</div>
            </div>

            <!-- Scroll Arrow -->
            <a href="#content" class="scroll-arrow">
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M12 19l-6-6M12 19l6-6"/>
                    </svg>
                </div>
            </a>
        </header>

        <!-- Main Content Section -->
        <main id="content" class="content-section">
            <!-- Floating Background Shapes - BEHIND EVERYTHING -->
            <div class="floating-bg-shape bg-shape-1"></div>
            <div class="floating-bg-shape bg-shape-2"></div>
            <div class="floating-bg-shape bg-shape-3"></div>
            <div class="floating-bg-shape bg-shape-4"></div>
            <div class="floating-bg-shape bg-shape-5"></div>

            <!-- Content Wrapper -->
            {% unless page.skip_container %}
        <div class="page-wrapper container">
        {% else %}
        <div class="page-wrapper" style="position: relative; z-index: 1;">
        {% endunless %}

        {{ content }}

        </div>

    <!-- Smooth Scroll Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });

            // Add intersection observer for fade-in animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);

            // Observe content elements
            document.querySelectorAll('.content-wrapper > *').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
