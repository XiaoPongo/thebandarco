---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 0 20px;
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
  }

  .single-description {
    margin-top: 2rem;
    font-size: 2.5vw;
    font-weight: 400;
    max-width: 80%;
    color: rgba(255, 255, 255, 0.9);
  }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <h1 class="header-title">
        {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
      </h1>
      <p class="single-description">{{ page.description }}</p>
    </div>

    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<!-- Optional Fade-In Animation -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    gsap.from(".gsap-header", {
      opacity: 0,
      duration: 1.5,
      ease: "power2.out"
    });

    gsap.from(".single-description", {
      opacity: 0,
      y: 30,
      duration: 1.5,
      delay: 0.5,
      ease: "power2.out"
    });
  });
</script>
