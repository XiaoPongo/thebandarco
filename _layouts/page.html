---
layout: default
---

<!-- Main Content Section with Rellax.js Parallax Effects -->
<main class="relative z-10 bg-gradient-to-b from-slate-100 to-white overflow-x-hidden py-20">
  <!-- Animated Background Elements -->
  <div class="fixed inset-0 pointer-events-none">
    <div class="rellax absolute top-20 left-10 text-blue-500/20" data-rellax-speed="-2">
      <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </div>
    <div class="rellax absolute top-40 right-20 text-purple-500/30" data-rellax-speed="-3">
      <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l1.5 4.5L18 6l-3 4.5L18 15l-4.5-1.5L12 18l-1.5-4.5L6 15l3-4.5L6 6l4.5 1.5L12 2z"/></svg>
    </div>
    <div class="rellax absolute top-60 left-1/4 text-cyan-500/20" data-rellax-speed="-1">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
    </div>
  </div>

  <!-- Content Container -->
  <div class="container mx-auto px-6">
    <div class="max-w-4xl mx-auto">
      <!-- Project Intro Section -->
      <div class="rellax mb-16" data-rellax-speed="-1">
        <div class="bg-white rounded-2xl shadow-2xl p-12 border border-gray-100">
          <h2 class="text-4xl font-bold text-gray-900 mb-6 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            Design Portfolio
          </h2>
          <p class="text-lg text-gray-600 leading-relaxed mb-8">
            A curated selection of my creative projects, showcasing my skills in design and development.
          </p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="text-center">
              <div class="w-16 h-16 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg width="24" height="24" fill="currentColor" class="text-white" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              </div>
              <h3 class="font-semibold text-gray-900 mb-2">Creative Designs</h3>
              <p class="text-gray-600 text-sm">Unique and innovative</p>
            </div>
            <div class="text-center">
              <div class="w-16 h-16 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg width="24" height="24" fill="currentColor" class="text-white" viewBox="0 0 24 24"><path d="M12 2l1.5 4.5L18 6l-3 4.5L18 15l-4.5-1.5L12 18l-1.5-4.5L6 15l3-4.5L6 6l4.5 1.5L12 2z"/></svg>
              </div>
              <h3 class="font-semibold text-gray-900 mb-2">Modern Aesthetics</h3>
              <p class="text-gray-600 text-sm">Sleek and stylish</p>
            </div>
            <div class="text-center">
              <div class="w-16 h-16 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg width="24" height="24" fill="currentColor" class="text-white" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
              </div>
              <h3 class="font-semibold text-gray-900 mb-2">Functional Art</h3>
              <p class="text-gray-600 text-sm">Beauty with purpose</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Dynamic Content with Parallax -->
      <div class="rellax mb-16" data-rellax-speed="-2">
        <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl p-12 border border-blue-100">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Rellax.js Script -->
<script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
<script>
  var rellax = new Rellax('.rellax', {
    speed: -5,
    center: false,
    wrapper: null,
    round: true,
    vertical: true,
    horizontal: false
  });
</script>

<!-- jQuery -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>

<!-- Custom Theme JavaScript -->
<script src="{{ site.baseurl }}/js/main.min.js"></script>
