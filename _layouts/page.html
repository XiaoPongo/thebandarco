---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Header Title Card</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .main-content {
            flex: 1 0 auto;
            position: relative;
            background: transparent;
            z-index: 5;
            padding-bottom: 15rem;
        }

        /* Header with Blue/Purple Gradient */
        .parallax-header {
            position: relative;
            height: 100vh;
            min-height: 600px;
            background: linear-gradient(135deg, #001f3f 0%, #7b1fa2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 1rem;
            text-align: center;
        }

        /* Header Content Box - Updated Style */
        .header-box {
            position: relative;
            z-index: 3;
            background-color: rgba(255, 255, 255, 0.12);
            padding: 3rem 4rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            max-width: 90%;
            color: white;
            animation: breathe 6s ease-in-out infinite;
        }

        .header-box h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .header-divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #7b1fa2, rgba(123, 31, 162, 0.5));
            margin: 2rem auto;
            border-radius: 2px;
            box-shadow: 0 2px 10px rgba(123, 31, 162, 0.3);
        }

        .subheading {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 300;
            opacity: 0.95;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); }
            50% { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: relative;
            z-index: 10;
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        .scroll-indicator p {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .arrow-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .arrow-circle svg {
            stroke: #90EE90;
            stroke-width: 2;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* Content Section - Updated for Better Readability */
        .content-section {
            padding: 8rem 2rem;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.85); /* Less transparent for better readability */
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 4rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin: 2rem 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .content-wrapper h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #2d3748;
        }

        .content-wrapper p {
            font-size: 1.2rem; /* Larger text for better readability */
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 1.5rem;
        }

        /* Floating Purple Circles */
        .floating-shape {
            position: absolute;
            background: radial-gradient(circle, rgba(123, 31, 162, 0.2), transparent 70%);
            border-radius: 50%;
            opacity: 0.5;
            z-index: 1;
        }

        .shape-small {
            width: 80px;
            height: 80px;
        }

        .shape-medium {
            width: 150px;
            height: 150px;
        }

        .shape-large {
            width: 250px;
            height: 250px;
        }

        @media (max-width: 768px) {
            .parallax-header {
                height: 80vh;
                min-height: 500px;
            }

            .header-box {
                padding: 2rem;
            }

            .content-section {
                padding: 4rem 1.5rem;
            }

            .content-wrapper {
                padding: 2rem;
            }

            .content-wrapper p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="parallax-header">
        <!-- Header Content Box -->
        <div class="header-box">
            <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
            <div class="header-divider"></div>
            <div class="subheading">{{ page.description }}</div>
        </div>

        <!-- Scroll Indicator -->
        <a href="#content" class="scroll-indicator">
            <p>Scroll to explore</p>
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </a>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <!-- Floating Purple Circles -->
        <div class="floating-shape shape-small rellax" data-rellax-speed="2" style="top: 50px; left: 5%;"></div>
        <div class="floating-shape shape-medium rellax" data-rellax-speed="-1" style="top: 120px; right: 10%;"></div>
        <div class="floating-shape shape-large rellax" data-rellax-speed="3" style="top: 200px; left: 15%;"></div>
        <div class="floating-shape shape-small rellax" data-rellax-speed="-2" style="top: 280px; right: 5%;"></div>
        <div class="floating-shape shape-medium rellax" data-rellax-speed="1" style="top: 350px; left: 20%;"></div>
        
        <div class="content-section" id="content">
            <div class="container">
                <div class="content-wrapper">
                    {{ content }}
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var rellax = new Rellax('.rellax', {
                center: true,
                wrapper: null,
                round: true,
                vertical: true,
                horizontal: false,
                breakpoints: [576, 768, 1024]
            });
            
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });

            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => rellax.refresh(), 250);
            });
        });
    </script>
</body>
</html>
