---
layout: default
---

<!-- Header (unchanged position, simplified) -->
<header style="width: 100%; height: 400px; position: relative; color: white; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: linear-gradient(135deg, #1a2a44 0%, #2c3e50 100%);">
  <div class="container" style="position: relative; z-index: 10;">
    <h1 style="font-size: 4.5rem; margin-bottom: 0.5rem; font-weight: 700;">
      {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
    </h1>
    <hr class="small" style="border-color: rgba(255,255,255,0.6); width: 70px; margin: 1rem auto;">
    <span class="subheading" style="font-size: 1.8rem; color: rgba(255,255,255,0.95); font-weight: 500;">
      {{ page.description }}
    </span>
  </div>
</header>

<!-- Main Content with Rellax.js Parallax Effects -->
<div class="container" style="margin-bottom: 100px; padding: 50px 0; background-color: #f5f7fa;">
  <div class="row">
    <!-- Adding Rellax classes for parallax effect -->
    <div class="rellax" data-rellax-speed="2" style="padding: 20px;">
      {{ content }}
    </div>
  </div>
</div>

<!-- Rellax.js Script -->
<script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
<script>
  // Initialize Rellax
  var rellax = new Rellax('.rellax', {
    speed: 2,
    center: false,
    wrapper: null,
    round: true,
    vertical: true,
    horizontal: false
  });
</script>

<!-- jQuery -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>

<!-- Custom Theme JavaScript -->
<script src="{{ site.baseurl }}/js/main.min.js"></script>
