---
layout: default
---

<!-- Font Awesome for menu icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Responsive Navbar -->
<nav class="navbar" id="navbar">
    <a href="{{ site.baseurl }}/" class="logo">
        <img src="{{ site.baseurl }}/logo.png" alt="BandarCO Logo" class="logo-img">
    </a>
    
    <ul class="nav-links" id="navLinks">
        <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}><i class="fas fa-home"></i> Home</a></li>
        <li><a href="{{ site.baseurl }}/default.html" {% if page.url contains "/default.html" %}class="active"{% endif %}><i class="fas fa-file-alt"></i> Default</a></li>
        <li><a href="{{ site.baseurl }}/pages.html" {% if page.url contains "/pages.html" %}class="active"{% endif %}><i class="fas fa-copy"></i> Pages</a></li>
        <li><a href="#contact"><i class="fas fa-envelope"></i> Contact</a></li>
    </ul>
    
    <div class="menu-btn" id="menuBtn">
        <i class="fas fa-bars"></i>
    </div>
</nav>

<style>
    /* Navbar Styles */
    .navbar {
        background: rgba(0, 0, 0, 0.85);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 5%;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .logo-img {
        height: 40px; /* Adjust based on your logo's aspect ratio */
        width: auto;
        transition: all 0.3s ease;
    }
    
    .nav-links {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
    }
    
    .nav-links li a {
        color: #fff;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 4px;
        margin: 0 5px;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    
    .nav-links li a:hover,
    .nav-links li a.active {
        background: rgba(255, 255, 255, 0.1);
    }
    
    .nav-links li a.active {
        color: #4CAF50;
    }
    
    .menu-btn {
        display: none;
        cursor: pointer;
        font-size: 24px;
        color: white;
    }
    
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            align-items: flex-start;
            padding: 15px;
        }
        
        .logo-img {
            height: 35px; /* Smaller logo on mobile */
        }
        
        .nav-links {
            display: none;
            width: 100%;
            flex-direction: column;
            margin-top: 15px;
        }
        
        .nav-links.show {
            display: flex;
        }
        
        .nav-links li {
            width: 100%;
            text-align: center;
            margin: 5px 0;
        }
        
        .nav-links li a {
            display: block;
            width: 100%;
            margin: 0;
        }
        
        .menu-btn {
            display: block;
            position: absolute;
            top: 15px;
            right: 20px;
        }
    }
</style>

<script>
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', function() {
                navLinks.classList.toggle('show');
            });
        }
        
        // Close menu when clicking on a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('show');
            });
        });
    });
</script>

<!-- Vanta Animated Header -->
<header id="vanta-header" style="width: 100%; height: 400px; position: relative; color: white; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; margin-top: 60px;">
  <div class="container" style="position: relative; z-index: 10;">
    <h1 style="font-size: 4.5rem; margin-bottom: 0.5rem; font-weight: 700;">
      {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
    </h1>
    <hr class="small" style="border-color: rgba(255,255,255,0.6); width: 70px; margin: 1rem auto;">
    <span class="subheading" style="font-size: 1.8rem; color: rgba(255,255,255,0.95); font-weight: 500;">
      {{ page.description }}
    </span>
  </div>
</header>

<!-- Rest of your existing content -->
<div class="container">
  <div class="row">
    {{ content }}
  </div>
</div>

<!-- Existing scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
  VANTA.WAVES({
    el: "#vanta-header",
    mouseControls: true,
    touchControls: true,
    minHeight: 400.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x1030b,
    shininess: 50.00,
    waveHeight: 20.00,
    waveSpeed: 1.00,
    zoom: 0.85
  });
</script>
