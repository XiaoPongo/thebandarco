---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        /* Complete Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Global Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9fafb;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overscroll-behavior-y: contain;
        }

        /* Safe Area Padding for Mobile Devices */
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Main Container */
        .page-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            background: #f9fafb;
            flex: 1 0 auto;
        }

        /* Parallax Header - Full Viewport Height with Safe Area */
        .parallax-header {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: -webkit-fill-available;
            background: linear-gradient(135deg, #020024 0%, #090979 35%, #bb00ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: env(safe-area-inset-top) 0 0 0;
            will-change: transform;
        }

        /* Header Content with Perfect Vertical Centering */
        .header-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 90%;
            padding: 0 5%;
            transform: translateY(-10%); /* Slightly raised for optical centering */
        }

        .header-content h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            line-height: 1.1;
        }

        .header-divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.5));
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .subheading {
            font-size: clamp(1.1rem, 3vw, 1.8rem);
            font-weight: 300;
            opacity: 0.95;
            line-height: 1.4;
            margin: 0 auto;
            max-width: 90%;
        }

        /* Scroll Arrow - Light Green */
        .scroll-arrow {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            cursor: pointer;
            text-decoration: none;
        }

        .arrow-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bounce 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .arrow-circle svg {
            stroke: #a3e635; /* Light green */
            stroke-width: 2;
            width: 20px;
            height: 20px;
        }

        /* Content Section with Smooth Transition */
        .content-section {
            position: relative;
            width: 100%;
            background: #f9fafb;
            padding: 4rem 0;
            z-index: 100;
            flex: 1 0 auto;
            margin-top: -5vh; /* Creates overlap for smooth transition */
            clip-path: polygon(0 5vh, 100% 0, 100% 100%, 0 100%);
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
            position: relative;
            z-index: 100;
        }

        /* Footer - Sticky with Safe Area */
        footer {
            background: #1a1a1a;
            color: white;
            padding: 1.5rem 5%;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            width: 100%;
            z-index: 100;
            text-align: center;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Responsive Design - Mobile First */
        @media (max-width: 768px) {
            .header-content {
                transform: translateY(-8%);
            }
            
            .header-content h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
            }
            
            .subheading {
                font-size: clamp(1rem, 4vw, 1.5rem);
            }
            
            .content-section {
                padding: 3rem 0;
                margin-top: -3vh;
                clip-path: polygon(0 3vh, 100% 0, 100% 100%, 0 100%);
            }
        }

        @media (max-width: 480px) {
            .header-content {
                transform: translateY(-5%);
            }
            
            .header-content h1 {
                font-size: clamp(1.8rem, 8vw, 2.5rem);
                margin-bottom: 1rem;
            }
            
            .header-divider {
                margin: 1rem auto;
            }
            
            .content-section {
                padding: 2rem 0;
                margin-top: -2vh;
                clip-path: polygon(0 2vh, 100% 0, 100% 100%, 0 100%);
            }
            
            footer {
                padding: 1rem 5%;
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }

        /* Landscape Orientation */
        @media (orientation: landscape) and (max-height: 500px) {
            .parallax-header {
                height: auto;
                min-height: 100vh;
                padding-top: max(5vh, env(safe-area-inset-top));
                padding-bottom: max(5vh, env(safe-area-inset-bottom));
            }
            
            .header-content {
                transform: none;
                padding: 5vh 5%;
            }
            
            .header-content h1 {
                font-size: clamp(1.8rem, 6vw, 3rem);
            }
            
            .subheading {
                font-size: clamp(0.9rem, 3vw, 1.2rem);
                max-width: 80%;
            }
            
            .scroll-arrow {
                bottom: max(20px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Parallax Header Section -->
        <header class="parallax-header" id="header">
            <!-- Header Content -->
            <div class="header-content">
                <h1>{{ page.title | default: site.title | default: "Projects" }}</h1>
                <div class="header-divider"></div>
                <div class="subheading">{{ page.description | default: "Beautiful web experiences crafted with passion" }}</div>
            </div>

            <!-- Scroll Arrow -->
            <a href="#content" class="scroll-arrow">
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 5v14M12 19l-6-6M12 19l6-6"/>
                    </svg>
                </div>
            </a>
        </header>

        <!-- Main Content Section -->
        <main id="content" class="content-section">
            <div class="content-wrapper">
                {{ content }}
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | default: 'Your Site' }}</p>
        </footer>
    </div>

    <!-- Smooth Scroll and Parallax Effects -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle safe areas for different mobile devices
            const updateSafeAreas = () => {
                document.documentElement.style.setProperty('--safe-area-top', env(safe-area-inset-top) + 'px');
                document.documentElement.style.setProperty('--safe-area-bottom', env(safe-area-inset-bottom) + 'px');
            };
            
            // Initial update
            updateSafeAreas();
            
            // Update on orientation change
            window.addEventListener('orientationchange', updateSafeAreas);
            window.addEventListener('resize', updateSafeAreas);

            // Smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });

            // Parallax and fade effect for header
            const header = document.getElementById('header');
            const contentSection = document.querySelector('.content-section');
            
            const handleScroll = () => {
                const scrollPosition = window.scrollY;
                const headerHeight = header.offsetHeight;
                
                // Parallax effect - subtle movement
                if (header) {
                    header.style.transform = `translateY(${scrollPosition * 0.3}px)`;
                }
                
                // Fade to white effect
                if (scrollPosition > 0 && scrollPosition < headerHeight) {
                    const opacity = 1 - (scrollPosition / headerHeight);
                    header.style.opacity = opacity;
                    contentSection.style.marginTop = `-${5 - (scrollPosition / headerHeight * 5)}vh`;
                }
            };
            
            // Initialize scroll effects
            window.addEventListener('scroll', handleScroll, { passive: true });
            
            // Handle mobile viewport height changes
            const updateViewportHeight = () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            };
            
            updateViewportHeight();
            window.addEventListener('resize', updateViewportHeight);
            window.addEventListener('orientationchange', updateViewportHeight);
        });
    </script>
</body>
</html>
