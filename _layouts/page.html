---
layout: default
---

<style>
  /* Added GSAP Header Styles */
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
  }

  .gsap-header p {
    font-size: 5vw;
    font-weight: 700;
    margin: 0;
    line-height: 1;
  }

  .text-container {
    position: relative;
    height: 5vw;
    margin-top: 1rem;
  }

  .text-container p {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }
</style>

<!-- GSAP Animated Header -->
<div id="wrapper">
  <section id="content">
    <div class="gsap-header" aria-hidden="true">
      <p>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</p>
      <div class="text-container">
        <p>{{ page.description }}</p>
        <p data-speed="0.95">{{ page.description }}</p>
        <p data-speed="0.9">{{ page.description }}</p>
        <p data-speed="0.85">{{ page.description }}</p>
        <p data-speed="0.8">{{ page.description }}</p>
        <p data-speed="0.75">{{ page.description }}</p>
        <p data-speed="0.7">{{ page.description }}</p>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container" style="margin-bottom: 100px;">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollSmoother.min.js"></script>

<!-- Initialize ScrollSmoother -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    ScrollSmoother.create({
      wrapper: "#wrapper",
      content: "#content",
      smooth: 1.5,
      effects: true,
      normalizeScroll: true
    });
  });
</script>

<!-- Original Scripts -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/main.min.js"></script>
