---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
  }

  /* Enhanced squiggly background with alternating pattern */
  .gsap-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%230ff' fill-opacity='0.25'%3E%3Cpath d='M10 10 Q15 0 20 10 T30 10' /%3E%3Cpath d='M50 10 Q45 0 40 10 T30 10' /%3E%3Cpath d='M10 40 Q0 35 10 30 T10 10' /%3E%3Cpath d='M50 40 Q60 35 50 30 T50 10' /%3E%3Cpath d='M10 70 Q15 60 20 70 T30 70' /%3E%3Cpath d='M50 70 Q45 60 40 70 T30 70' /%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
    opacity: 0.2;
    z-index: 0;
    animation: bgMove 30s linear infinite;
  }

  @keyframes bgMove {
    0% { background-position: 0 0; }
    100% { background-position: 80px 80px; }
  }

  /* Enhanced header title with glow effect */
  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    z-index: 2;
    text-shadow: 0 0 10px rgba(255,255,255,0.3), 
                 0 0 20px rgba(110, 0, 255, 0.5);
    position: relative;
    padding: 20px 40px;
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.1);
    transform-style: preserve-3d;
    transform: perspective(500px);
    transition: all 0.3s ease;
  }

  .header-title:hover {
    transform: perspective(500px) translateZ(20px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  /* Enhanced description wrapper with centered alignment */
  .description-wrapper {
    position: relative;
    margin-top: 2rem;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .description-layer {
    position: absolute;
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #FF6200;
    white-space: nowrap;
    mix-blend-mode: lighten;
    pointer-events: none;
    text-shadow: 0 0 5px rgba(255, 98, 0, 0.5);
  }

  /* Layer opacity */
  .description-layer:nth-child(1) { opacity: 1; }
  .description-layer:nth-child(2) { opacity: 0.8; }
  .description-layer:nth-child(3) { opacity: 0.6; }
  .description-layer:nth-child(4) { opacity: 0.4; }
  .description-layer:nth-child(5) { opacity: 0.2; }

  /* Enhanced bouncing circle with glow */
  .bouncing-circle {
    position: absolute;
    bottom: 20%;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #A8FF8D;
    background-color: rgba(168, 255, 141, 0.2);
    animation: bounce 2s infinite ease-in-out;
    z-index: 3;
    box-shadow: 0 0 10px rgba(168, 255, 141, 0.5),
                0 0 20px rgba(168, 255, 141, 0.3);
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
  }

  /* Floating decorative elements */
  .floating-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    z-index: 1;
    filter: blur(1px);
  }

  /* Mobile: scale up title + description */
  @media screen and (max-width: 768px) {
    .header-title {
      font-size: 12vw;
      padding: 15px 30px;
    }
    .description-layer {
      font-size: 6vw;
    }
  }

  /* Maintain existing layout styles */
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <!-- Random floating dots -->
      <div class="floating-dot" style="top:20%; left:15%; animation: float 8s infinite ease-in-out;"></div>
      <div class="floating-dot" style="top:70%; left:80%; animation: float 12s infinite ease-in-out 2s;"></div>
      <div class="floating-dot" style="top:40%; left:10%; animation: float 10s infinite ease-in-out 1s;"></div>
      
      <!-- Encircled bouncing dot -->
      <div class="bouncing-circle"></div>

      <h1 class="header-title">
        {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
      </h1>

      <!-- Parallax layered description -->
      <div class="description-wrapper">
        <div class="description-layer" data-depth="1">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
      </div>
    </div>

    <!-- Main Content (unchanged) -->
    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger);

    // Floating dots animation
    gsap.to(".floating-dot", {
      y: "+=30",
      x: "+=20",
      duration: 5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });

    const layers = gsap.utils.toArray(".description-layer");

    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: `${(1 - depth) * 100}px`,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>
