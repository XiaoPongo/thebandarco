---
layout: default
---

<!-- Vanta Animated Header (Full Height, Sticky Background) -->
<header id="vanta-header" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1;"></header>

<!-- Main Header Content (Center aligned on page load) -->
<div class="vanta-overlay">
  <div class="vanta-heading">
    <img src="{{ site.baseurl }}/img/logo.png" alt="Logo" class="vanta-logo">
    <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
    <p class="description">{{ page.description }}</p>
  </div>
</div>

<!-- Sticky Mini Navigation -->
<nav class="mini-nav" id="mini-nav">
  <div class="mini-nav-content">
    <img src="{{ site.baseurl }}/img/logo.png" alt="Logo" class="mini-logo">
    <span class="mini-title">{{ site.title }}</span>
    <ul class="mini-links">
      <li><a href="{{ site.baseurl }}/">Home</a></li>
      <li><a href="{{ site.baseurl }}/about/">About</a></li>
      <li><a href="{{ site.baseurl }}/journal/">Blog</a></li>
      <li><a href="{{ site.baseurl }}/contact/">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Main Content -->
<div class="container" style="margin-top: 100vh;">
  <div class="row">
    {{ content }}
  </div>
</div>

<!-- Vanta Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
  VANTA.WAVES({
    el: "#vanta-header",
    mouseControls: true,
    touchControls: true,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x1030b,
    shininess: 50.00,
    waveHeight: 20.00,
    waveSpeed: 1.00,
    zoom: 0.85
  });

  window.addEventListener("scroll", function () {
    const nav = document.getElementById("mini-nav");
    if (window.scrollY > 100) {
      nav.classList.add("visible");
    } else {
      nav.classList.remove("visible");
    }
  });
</script>

<!-- Styling -->
<style>
  body {
    margin: 0;
    font-family: sans-serif;
  }

  .vanta-overlay {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    z-index: 1;
  }

  .vanta-logo {
    width: 80px;
    margin-bottom: 1rem;
  }

  .vanta-heading h1 {
    font-size: 3.5rem;
    margin: 0.5rem 0;
  }

  .vanta-heading .description {
    font-size: 1.5rem;
    opacity: 0.9;
  }

  .mini-nav {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    color: white;
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    z-index: 999;
    transition: all 0.3s ease-in-out;
  }

  .mini-nav.visible {
    display: flex;
  }

  .mini-logo {
    width: 40px;
    margin-right: 1rem;
  }

  .mini-title {
    font-size: 1.25rem;
    font-weight: bold;
  }

  .mini-links {
    list-style: none;
    display: flex;
    gap: 1rem;
    margin: 0;
    padding: 0;
  }

  .mini-links a {
    color: white;
    text-decoration: none;
    font-size: 0.95rem;
  }

  .mini-links a:hover {
    text-decoration: underline;
  }
</style>

<!-- jQuery & Bootstrap -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/main.min.js"></script>
