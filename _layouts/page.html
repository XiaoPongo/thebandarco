---
layout: default
---

<style>
  /* GSAP Header Styles */
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 0 20px;
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    margin-bottom: 2rem;
  }

  .text-container {
    position: relative;
    margin-top: 1rem;
    overflow: visible; /* Allow layers to move freely */
  }

  .text-container p {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    margin: 0;
    font-size: 3.5vw;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.85);
    opacity: 0.9;
    transform: translateY(0);
  }

  /* Make description lines more distinct */
  .text-container p:nth-child(1) { color: rgba(255, 255, 255, 0.95); }
  .text-container p:nth-child(2) { color: rgba(255, 200, 200, 0.9); }
  .text-container p:nth-child(3) { color: rgba(200, 255, 200, 0.85); }
  .text-container p:nth-child(4) { color: rgba(200, 200, 255, 0.8); }
  .text-container p:nth-child(5) { color: rgba(255, 255, 200, 0.75); }
  .text-container p:nth-child(6) { color: rgba(255, 200, 255, 0.7); }
  .text-container p:nth-child(7) { color: rgba(200, 255, 255, 0.65); }

  /* Ensure smooth scrolling */
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  
  #wrapper {
    position: relative;
    overflow: hidden;
  }
</style>

<!-- GSAP Animated Header -->
<div id="wrapper">
  <section id="content">
    <div class="gsap-header" aria-hidden="true">
      <h1 class="header-title">{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
      <div class="text-container">
        <p>{{ page.description }}</p>
        <p data-speed="0.95">{{ page.description }}</p>
        <p data-speed="0.9">{{ page.description }}</p>
        <p data-speed="0.85">{{ page.description }}</p>
        <p data-speed="0.8">{{ page.description }}</p>
        <p data-speed="0.75">{{ page.description }}</p>
        <p data-speed="0.7">{{ page.description }}</p>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container" style="margin-bottom: 100px;">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<!-- Initialize Parallax Effects -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Register ScrollTrigger
    gsap.registerPlugin(ScrollTrigger);
    
    // Apply parallax effects to description layers
    gsap.utils.toArray('.text-container p').forEach((layer, i) => {
      gsap.to(layer, {
        transform: `translateY(${(i * 30) - 100}px)`,
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>

<!-- Original Scripts -->    
<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="{{ site.baseurl }}/js/main.min.js"></script>
