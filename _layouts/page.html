---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
  }

  /* Squiggly background using SVG pattern */
  .gsap-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%230ff' fill-opacity='0.25'%3E%3Cpath d='M10 10 Q15 0 20 10 T30 10' /%3E%3Ccircle cx='10' cy='30' r='2' /%3E%3Cpath d='M5 35 L15 25' stroke='%230ff' stroke-width='1' fill='none' /%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
    opacity: 0.2;
    z-index: 0;
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    z-index: 2;
  }

  .description-wrapper {
    position: relative;
    margin-top: 2rem;
  }

  .description-layer {
    position: absolute;
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #FF6200;
    white-space: nowrap;
    mix-blend-mode: lighten;
    pointer-events: none;
  }

  /* Layer opacity */
  .description-layer:nth-child(1) { opacity: 1; }
  .description-layer:nth-child(2) { opacity: 0.8; }
  .description-layer:nth-child(3) { opacity: 0.6; }
  .description-layer:nth-child(4) { opacity: 0.4; }
  .description-layer:nth-child(5) { opacity: 0.2; }

  /* Light green bouncing circle */
  .bouncing-circle {
    position: absolute;
    bottom: 20%;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #A8FF8D;
    background-color: rgba(168, 255, 141, 0.2);
    animation: bounce 2s infinite ease-in-out;
    z-index: 3;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
  }

  /* Mobile: scale up title + description */
  @media screen and (max-width: 768px) {
    .header-title {
      font-size: 12vw;
    }
    .description-layer {
      font-size: 6vw;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <!-- Encircled bouncing dot -->
      <div class="bouncing-circle"></div>

      <h1 class="header-title">
        {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
      </h1>

      <!-- Parallax layered description -->
      <div class="description-wrapper">
        <div class="description-layer" data-depth="1">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger);

    const layers = gsap.utils.toArray(".description-layer");

    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: `${(1 - depth) * 100}px`,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>
