---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 0 20px;
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    z-index: 2;
  }

  .description-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 3rem;
  }

  .description-layer {
    position: absolute;
    font-size: 4vw;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    color: white;
    mix-blend-mode: overlay;
    opacity: 0.9;
    pointer-events: none;
  }

  .description-layer:nth-child(1) { color: rgba(255, 255, 255, 1); }
  .description-layer:nth-child(2) { color: rgba(255, 255, 255, 0.8); }
  .description-layer:nth-child(3) { color: rgba(255, 255, 255, 0.6); }
  .description-layer:nth-child(4) { color: rgba(255, 255, 255, 0.4); }
  .description-layer:nth-child(5) { color: rgba(255, 255, 255, 0.2); }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <h1 class="header-title">
        {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
      </h1>

      <!-- Layered Description with Parallax -->
      <div class="description-wrapper">
        <div class="description-layer" data-depth="1">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
        <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP Libraries -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger);

    const layers = gsap.utils.toArray(".description-layer");

    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: `${(1 - depth) * 100}px`,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });
  });
</script>
