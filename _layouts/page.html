---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Header Title Card</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1 0 auto;
            background: transparent;
            z-index: 5;
            padding-bottom: 10rem;
        }

        /* Updated Parallax Header */
        .parallax-header {
            position: relative;
            height: 100vh;
            min-height: 600px;
            background: linear-gradient(135deg, #001f3f 0%, #7b1fa2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 1rem;
            text-align: center;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 120%;
            height: 120%;
            background: linear-gradient(135deg, #001f3f 0%, #7b1fa2 100%);
            opacity: 0.9;
            z-index: 0;
        }

        .parallax-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 31, 63, 0.15) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(123, 31, 162, 0.15) 0%, transparent 30%);
            z-index: 1;
        }

        .parallax-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.9));
            z-index: 2;
        }

        /* Parallax Elements - Circles and Geometric Shapes */
        .parallax-element {
            position: absolute;
            z-index: 1;
            filter: blur(1px);
            opacity: 0.6;
        }

        .circle {
            border-radius: 50%;
        }

        .geometric-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: -10%;
            transform: rotate(45deg);
            border-radius: 20px;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            top: 60%;
            right: -5%;
            border-radius: 50%;
        }

        .shape-3 {
            width: 150px;
            height: 400px;
            top: 20%;
            right: 20%;
            transform: rotate(-15deg);
            border-radius: 75px;
        }

        /* Floating Shapes for Content Section */
        .floating-shape {
            background: radial-gradient(circle, rgba(0, 31, 63, 0.3), transparent 70%);
            border-radius: 50%;
        }

        .shape-small {
            width: 60px;
            height: 60px;
        }

        .shape-medium {
            width: 120px;
            height: 120px;
        }

        .shape-large {
            width: 200px;
            height: 200px;
        }

        /* Header Box - More Translucent */
        .header-box {
            position: relative;
            z-index: 3;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 3rem 4rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: breathe 6s ease-in-out infinite;
            backdrop-filter: blur(15px);
            max-width: 90%;
            color: white;
            overflow: hidden;
        }

        .header-box h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .header-divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #7b1fa2, rgba(123, 31, 162, 0.5));
            margin: 2rem auto;
            border-radius: 2px;
            box-shadow: 0 2px 10px rgba(123, 31, 162, 0.3);
        }

        .subheading {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 300;
            opacity: 0.95;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); }
            50% { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: relative;
            z-index: 10;
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        .scroll-indicator p {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .arrow-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .arrow-circle svg {
            stroke: white;
            stroke-width: 2;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* Content Section */
        .content-section {
            padding: 10rem 2rem;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 4rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin: 2rem 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .parallax-header {
                height: 100vh;
                min-height: 600px;
            }

            .header-box {
                padding: 2rem;
            }

            .content-section {
                padding: 5rem 1.5rem;
            }

            .content-wrapper {
                padding: 2rem;
            }

            .geometric-shape {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="parallax-header">
        <div class="parallax-bg rellax" data-rellax-speed="-7"></div>
        <div class="geometric-shape shape-1 rellax floating" data-rellax-speed="-3"></div>
        <div class="geometric-shape shape-2 rellax" data-rellax-speed="-5"></div>
        <div class="geometric-shape shape-3 rellax" data-rellax-speed="-2"></div>
        <div class="parallax-element circle rellax" data-rellax-speed="-3" style="top: 15%; left: 10%; width: 120px; height: 120px; background: radial-gradient(circle, rgba(0, 31, 63, 0.3), transparent 70%);"></div>
        <div class="parallax-element circle rellax" data-rellax-speed="-1" style="bottom: 25%; right: 20%; width: 80px; height: 80px; background: radial-gradient(circle, rgba(123, 31, 162, 0.25), transparent 70%);"></div>
        <div class="parallax-element circle rellax" data-rellax-speed="1.5" style="bottom: 30%; left: 15%; width: 100px; height: 100px; background: radial-gradient(circle, rgba(0, 51, 102, 0.2), transparent 70%);"></div>

        <div class="header-box">
            <h1>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
            <div class="header-divider"></div>
            <div class="subheading">{{ page.description }}</div>
        </div>

        <a href="#content" class="scroll-indicator">
            <p>Scroll to explore</p>
            <div class="arrow-circle">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
                    <path d="M12 5v14M12 19l-6-6M12 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </a>
    </header>

    <main class="main-content">
        <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="2" style="top: 100px; left: 10%;"></div>
        <div class="parallax-element floating-shape shape-medium rellax" data-rellax-speed="-1" style="top: 300px; right: 15%;"></div>
        <div class="parallax-element floating-shape shape-large rellax" data-rellax-speed="3" style="top: 600px; left: 5%;"></div>
        <div class="parallax-element floating-shape shape-small rellax" data-rellax-speed="-2" style="top: 800px; right: 10%;"></div>
        <div class="parallax-element floating-shape shape-medium rellax" data-rellax-speed="1" style="top: 1200px; left: 20%;"></div>
        
        <div class="content-section" id="content">
            <div class="container">
                <div class="content-wrapper">
                    {{ content }}
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var rellax = new Rellax('.rellax', {
                center: true,
                wrapper: null,
                round: true,
                vertical: true,
                horizontal: false,
                breakpoints: [576, 768, 1024]
            });
            
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });

            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => rellax.refresh(), 250);
            });
        });
    </script>
</body>
</html>
