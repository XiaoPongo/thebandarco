---
layout: default
---

<style>
  .gsap-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6e00ff, #9d00c9);
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
  }

  /* Overlay line pattern in dark blue */
  .gsap-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23051233' stroke-width='3' stroke-opacity='0.15'%3E%3Cpath d='M20 20 L40 40' /%3E%3Cpath d='M80 40 L100 20' /%3E%3Cpath d='M20 60 L40 80' /%3E%3Cpath d='M80 80 L100 60' /%3E%3C/g%3E%3C/svg%3E");
    background-size: 120px 120px;
    z-index: 0;
  }
  
  gsap.from(".header-content", {
  y: 40,
  opacity: 0,
  duration: 1,
  ease: "power2.out",
  delay: 0.3
});

  gsap.from(".description-layer", {
  opacity: 0,
  y: 20,
  stagger: 0.1,
  delay: 0.5,
  duration: 0.6,
  ease: "power1.out"
});

  .header-content {
  opacity: 0; /* Optional: prevent flash */
}

  .header-content {
    position: relative;
    z-index: 2;
    margin-bottom: 40px;
  }

  .header-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    padding: 20px 40px;
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .description-wrapper {
    position: relative;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    z-index: 2;
  }

  .description-layer {
    position: absolute;
    font-size: 3vw;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #FF6200;
    white-space: nowrap;
    mix-blend-mode: lighten;
    pointer-events: none;
    text-shadow: 0 0 5px rgba(255, 98, 0, 0.5);
  }

  .description-layer:nth-child(1) { opacity: 1; }
  .description-layer:nth-child(2) { opacity: 0.8; }
  .description-layer:nth-child(3) { opacity: 0.6; }
  .description-layer:nth-child(4) { opacity: 0.4; }
  .description-layer:nth-child(5) { opacity: 0.2; }

  .scroll-arrow {
    position: absolute;
    bottom: -200px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    cursor: pointer;
  }

  .arrow-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: bounce 2s ease-in-out infinite;
    transition: background 0.3s ease;
  }

  .arrow-circle:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .arrow-circle svg {
    stroke: #59e659;
    stroke-width: 2;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Responsive mobile: arrow placed directly below description */
  @media screen and (max-width: 768px) {
  .header-title {
    font-size: 12vw;
    padding: 15px 30px;
  }

  .description-layer {
    font-size: 5vw;
    white-space: normal;
    text-align: center;
  }

  .scroll-arrow {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 325%; /* Pushes the arrow lower within header */
  }

  .header-content {
    margin-top: -100px;
  }
}

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }
  .header-title:hover {
  transform: scale(1.02);
  transition: transform 0.3s ease;
}
</style>

<div id="wrapper">
  <section id="content">
    <div class="gsap-header">
      <div class="header-content">
        <h1 class="header-title">
          {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
        </h1>

        <div class="description-wrapper">
          <div class="description-layer" data-depth="1">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.9">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.8">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.7">{{ page.description }}</div>
          <div class="description-layer" data-depth="0.6">{{ page.description }}</div>
        </div>

        <!-- Arrow placed *after* description for mobile -->
        <div class="scroll-arrow">
          <div class="arrow-circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M5 10L12 17L19 10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP + ScrollTo -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

    const layers = gsap.utils.toArray(".description-layer");

    layers.forEach(layer => {
      const depth = layer.dataset.depth;
      gsap.to(layer, {
        y: (1 - depth) * 50,
        ease: "none",
        scrollTrigger: {
          trigger: ".gsap-header",
          start: "top top",
          end: "bottom top",
          scrub: true
        }
      });
    });

    // Scroll to content section on arrow click
    document.querySelector('.scroll-arrow').addEventListener('click', function () {
      gsap.to(window, {
  duration: 0.6,
  scrollTo: ".container",
  ease: "power1.out"
});
    });
  });
</script>
