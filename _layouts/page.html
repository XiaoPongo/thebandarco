---
layout: default
---

<style>
  .vanta-header {
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* Semi-transparent gradient to blend with Vanta.js WAVES */
    background: linear-gradient(135deg, rgba(5, 18, 51, 0.5), rgba(110, 0, 255, 0.5), rgba(114, 9, 183, 0.5));
    color: white;
    overflow: hidden;
    text-align: center;
    padding: 0 20px;
  }

  /* Ensure Vanta.js canvas is behind content */
  #vanta-header canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0 !important; /* Force canvas behind content */
  }

  .title-card {
    position: relative;
    z-index: 10; /* Ensure content is above canvas */
    margin-bottom: 40px;
  }

  .card-title {
    font-size: 6vw;
    font-weight: 900;
    margin: 0;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    padding: 20px 40px;
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255,255,255,0.1);
    display: inline-block; /* Fit content width */
  }

  .card-description {
    font-size: 1.5rem;
    font-weight: 600;
    margin-top: 20px;
    color: #fff;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
    max-width: 80%;
    line-height: 1.4;
  }

  .scroll-arrow {
    position: absolute;
    bottom: -100px; /* Higher for visibility */
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    cursor: pointer;
  }

  .arrow-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); /* Increased opacity for contrast */
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.4); /* Brighter border */
    display: flex;
    justify-content: center;
    align-items: center;
    animation: bounce 2s ease-in-out infinite;
    transition: background 0.3s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .arrow-circle:hover {
    background: rgba(255, 255, 255, 0.3); /* Brighter on hover */
  }

  .arrow-circle:focus {
    outline: none;
    box-shadow: none;
  }

  .arrow-circle svg {
    stroke: #59e659; /* Light green arrow */
    stroke-width: 2.5; /* Thicker stroke for emphasis */
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Responsive mobile adjustments */
  @media screen and (max-width: 768px) {
    .card-title {
      font-size: 12vw;
      padding: 15px 30px;
    }

    .card-description {
      font-size: 1rem;
      max-width: 90%;
    }

    .scroll-arrow {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 300%; /* Adjusted for mobile */
    }

    .title-card {
      margin-top: -100px;
    }
  }

  @media (hover: none) and (pointer: coarse) {
    .arrow-circle {
      -webkit-tap-highlight-color: transparent;
      background-clip: padding-box;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  #wrapper {
    position: relative;
    overflow: hidden;
  }

  .container {
    margin-bottom: 100px;
  }

  .card-title:hover {
    transform: scale(1.02);
    transition: transform 0.3s ease;
  }

  .arrow-circle *,
  .arrow-circle:focus,
  .arrow-circle:active,
  .arrow-circle *:focus,
  .arrow-circle *:active {
    outline: none !important;
    box-shadow: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .scroll-arrow {
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
</style>

<div id="wrapper">
  <section id="content">
    <div class="vanta-header" id="vanta-header">
      <div class="title-card">
        <h1 class="card-title">
          {% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}
        </h1>
        <p class="card-description">
          {{ page.description }}
        </p>
        <div class="scroll-arrow">
          <div class="arrow-circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M5 10L12 17L19 10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="container">
      <div class="row">
        {{ content }}
      </div>
    </div>
  </section>
</div>

<!-- GSAP + ScrollTo for arrow functionality -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>
<!-- Vanta.js and Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

    // Initialize Vanta.js WAVES with movement disabled
    VANTA.WAVES({
      el: "#vanta-header",
      mouseControls: false, // Disable mouse interaction
      touchControls: false, // Disable touch interaction
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x6e00ff, // Base color close to gradient midpoint
      shininess: 30,
      waveHeight: 15,
      waveSpeed: 1,
      zoom: 1
    });

    // Scroll to content section on arrow click
    document.querySelector('.scroll-arrow').addEventListener('click', function () {
      gsap.to(window, {
        duration: 0.6,
        scrollTo: ".container",
        ease: "power1.out"
      });
    });
  });
</script>
