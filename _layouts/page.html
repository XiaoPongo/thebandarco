---
layout: default
---

<style>
  /* Reset and base styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: #333;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  /* Main content container */
  .main-content {
    flex: 1 0 auto;
    position: relative;
    background: transparent;
    z-index: 5;
    padding-bottom: 15rem;
  }
  
  /* Header Section - Updated to match Invesco style */
  .parallax-header {
    position: relative;
    height: 100vh;
    min-height: 600px;
    background: linear-gradient(135deg, #0055A5 0%, #002D72 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 2rem;
  }
  
  .header-content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: white;
    max-width: 1200px;
    width: 100%;
  }
  
  .header-content h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  
  .header-divider {
    width: 80px;
    height: 4px;
    background: #FFD100;
    margin: 2rem auto;
  }
  
  .header-content .subheading {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 400;
    line-height: 1.4;
    max-width: 800px;
    margin: 0 auto;
  }
  
  /* Content Section */
  .content-section {
    padding: 8rem 0;
    position: relative;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
  }
  
  /* Content styling - Translucent box */
  .content-wrapper {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 4rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    margin: 2rem 0;
  }
  
  .content-wrapper h2 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    color: #002D72;
  }
  
  .content-wrapper p {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #333;
    margin-bottom: 1.5rem;
  }
  
  /* Responsive design */
  @media (max-width: 768px) {
    .parallax-header {
      height: 80vh;
      min-height: 500px;
    }
    
    .content-section {
      padding: 4rem 0;
    }
    
    .content-wrapper {
      padding: 2rem;
    }
  }
  
  /* Animation keyframes */
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
</style>

<!-- Header Section -->
<header class="parallax-header">
  <div class="header-content">
    <h1>FEED YOUR CURIOSITY</h1>
    <div class="header-divider"></div>
    <div class="subheading">
      PROJECTS • BLOG • ABOUT ME
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <div class="content-section">
    <div class="container">
      <div class="content-wrapper">
        {{ content }}
      </div>
    </div>
  </div>
</main>

<!-- Scripts -->
<script>
  // Simple parallax effect
  document.addEventListener('DOMContentLoaded', function() {
    const header = document.querySelector('.parallax-header');
    
    if (header) {
      window.addEventListener('scroll', function() {
        const scrollPosition = window.pageYOffset;
        header.style.backgroundPositionY = scrollPosition * 0.5 + 'px';
      });
    }
    
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  });
</script>
