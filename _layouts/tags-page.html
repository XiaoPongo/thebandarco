---
layout: default
---
<div class="tag-page">
    <h1>Posts tagged with "{{ page.title }}"</h1>
    
    <ul class="post-list">
        {% for post in site.tags[page.title] %}
        <li>
            <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
            <h2>
                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </h2>
        </li>
        {% endfor %}
    </ul>
</div>
