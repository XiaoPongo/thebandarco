<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  {% if page.url == "/404.html" %}
    <meta http-equiv="refresh" content="5; url={{ site.baseurl }}/journal" />
  {% endif %}

  <body>
    <!-- Include Navbar -->
<div id="navbar-container"></div>

<script>
    // Load navbar dynamically
    fetch('/nav.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
</script>

    <!-- Dark Mode Toggle Button -->
    <button id="dark-mode-toggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon"></i>
    </button>

    {% include nav.html %}
    {{ content }}
    {% include search.html %}
    {% include newsletter.html %}
    {% include footer.html %}
    {% include Scroll_to_Top.html %}

    <!-- Dark Mode Styles -->
    <style>
      :root {
        --bg-color: #fff;
        --text-color: #000;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body.dark-mode {
        --bg-color: #121212;
        --text-color: #f0f0f0;
      }

      #dark-mode-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 999;
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--text-color);
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      #dark-mode-toggle:hover {
        transform: rotate(20deg);
      }
    </style>

    <!-- Dark Mode Script -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('dark-mode-toggle');
        const icon = toggle.querySelector('i');

        function setDarkMode(enabled) {
          document.body.classList.toggle('dark-mode', enabled);
          icon.className = enabled ? 'fas fa-sun' : 'fas fa-moon';
          localStorage.setItem('darkMode', enabled);
        }

        toggle.addEventListener('click', () => {
          const isDark = document.body.classList.contains('dark-mode');
          setDarkMode(!isDark);
        });

        setDarkMode(localStorage.getItem('darkMode') === 'true');
      });
    </script>

    <!-- Scroll Toggle Script (Cleaned & Unified) -->
    <script>
      const scrollToggle = document.getElementById("scrollToggle");
      const scrollToggleBig = document.getElementById("scrollToggleBig");

      function updateScrollArrows() {
        const isAtTop = window.scrollY < 100;
        const label = (isAtTop ? "↓ " : "↑ ") + "The Bandar Co.";

        if (scrollToggle) scrollToggle.textContent = label;
        if (scrollToggleBig) scrollToggleBig.textContent = label;
      }

      function scrollBehavior() {
        const isAtTop = window.scrollY < 100;
        window.scrollTo({
          top: isAtTop ? document.body.scrollHeight : 0,
          behavior: "smooth",
        });
      }

      if (scrollToggle) scrollToggle.addEventListener("click", scrollBehavior);
      if (scrollToggleBig) scrollToggleBig.addEventListener("click", scrollBehavior);

      window.addEventListener("scroll", updateScrollArrows);
      window.addEventListener("load", updateScrollArrows);
    </script>
  </body>
</html>
