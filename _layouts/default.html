<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    {% if page.url == "/404.html" %}
      <meta http-equiv="refresh" content="5; url={{ site.baseurl }}/journal" />
    {% endif %}
  </head>

  <body>
    {% include nav.html %}

    {{ content }}

    {% include newsletter.html %}

    {% include footer.html %}

        {% include Scroll_to_Top.html %}

    <!-- Super Search Scripts -->
    <script src="{{ '/js/super-search.js' | relative_url }}"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        superSearch({
          searchFile: '{{ "/feed.xml" | relative_url }}',
          searchSelector: '#js-super-search',
          inputSelector: '#js-super-search__input',
          resultsSelector: '#js-super-search__results'
        });
      });
    </script>

  </body>
</html>
  </body>
</html>
