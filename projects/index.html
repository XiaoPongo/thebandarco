<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery Pagination</title>
  <style>
    body {
      background-color: #111827;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      color: white;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      padding: 2rem;
    }

    .gallery-item {
      background: #1f2937;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.02);
    }

    .gallery-icon img {
      width: 100%;
      display: block;
      height: auto;
    }

    .gallery-caption {
      padding: 1rem;
    }

    .gallery-caption h3 {
      margin: 0;
      font-size: 1.2rem;
      color: #fff;
    }

    .gallery-caption p {
      margin: 0.4rem 0;
      color: #d1d5db;
      font-size: 0.9rem;
    }

    .punchline {
      font-style: italic;
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 0 2rem;
    }

    .pagination .btn {
      background-color: #374151;
      color: white;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination .btn:disabled {
      background-color: #6b7280;
      cursor: not-allowed;
    }

    .pagination .btn.current {
      background-color: #4f46e5;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <section id="content">
    <div id="gallery" class="gallery masonry-gallery"></div>

    <div class="pagination">
      <button id="prevPage" class="btn" disabled>Previous</button>
      <span id="pageNumbers"></span>
      <button id="nextPage" class="btn">Next</button>
    </div>
  </section>

  <script>
    const allImages = [
      {
        image_path: "/projects/albums/alb01.jpg",
        gallery_folder: "/projects/gallery01/",
        gallery_name: "Gallery 1",
        gallery_date: "July 2015",
        punchline: "An early vision taking shape"
      },
      {
        image_path: "/projects/albums/alb02.jpg",
        gallery_folder: "/projects/gallery02/",
        gallery_name: "Gallery 2",
        gallery_date: "June 2015",
        punchline: "Where design meets function"
      },
      {
        image_path: "/projects/albums/alb03.jpg",
        gallery_folder: "/projects/gallery03/",
        gallery_name: "Gallery 3",
        gallery_date: "May 2015",
        punchline: "Bold lines, clear purpose"
      },
      {
        image_path: "/projects/albums/alb04.jpg",
        gallery_folder: "/projects/gallery04/",
        gallery_name: "Gallery 4",
        gallery_date: "April 2015",
        punchline: "Design through iteration"
      },
      {
        image_path: "/projects/albums/alb05.jpg",
        gallery_folder: "/projects/gallery05/",
        gallery_name: "Gallery 5",
        gallery_date: "March 2015",
        punchline: "The blueprint begins"
      },
      {
        image_path: "/projects/albums/alb06.jpg",
        gallery_folder: "/projects/gallery06/",
        gallery_name: "Gallery 6",
        gallery_date: "February 2015",
        punchline: "Details make the difference"
      }
    ];

    const projectsPerPage = 4;
    let currentPage = 1;

    function renderGalleryPage(page) {
      const start = (page - 1) * projectsPerPage;
      const end = start + projectsPerPage;
      const currentImages = allImages.slice(start, end);

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = "";

      currentImages.forEach(image => {
        const figure = document.createElement('figure');
        figure.className = 'gallery-item';
        figure.innerHTML = `
          <header class="gallery-icon">
            <a href="${image.gallery_folder}">
              <img src="${image.image_path}" alt="${image.gallery_name}">
            </a>
          </header>
          <figcaption class="gallery-caption">
            <h3>${image.gallery_name}</h3>
            <p>${image.gallery_date}</p>
            <p class="punchline">${image.punchline || ""}</p>
          </figcaption>
        `;
        gallery.appendChild(figure);
      });

      updatePagination();
    }

    function updatePagination() {
      const totalPages = Math.ceil(allImages.length / projectsPerPage);
      const prevBtn = document.getElementById('prevPage');
      const nextBtn = document.getElementById('nextPage');
      const pageNumbers = document.getElementById('pageNumbers');

      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;

      pageNumbers.innerHTML = "";
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn' + (i === currentPage ? ' current' : '');
        btn.innerText = i;
        btn.addEventListener('click', () => {
          currentPage = i;
          renderGalleryPage(currentPage);
        });
        pageNumbers.appendChild(btn);
      }
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderGalleryPage(currentPage);
      }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      const totalPages = Math.ceil(allImages.length / projectsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderGalleryPage(currentPage);
      }
    });

    renderGalleryPage(currentPage);
  </script>

</body>
</html>
