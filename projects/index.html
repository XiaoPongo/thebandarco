<html class="no-js" lang="en">
<head>
    <meta content="charset=utf-8">
    <link rel="stylesheet" href="{{ "/css/selena.css" | prepend: site.baseurl }}">
    <style>
        .gallery {
            padding: 2rem 0;
            background-color: #f9fafb;
        }
        
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .gallery h2 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #1f2937;
        }
        
        .masonry-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        @media (max-width: 768px) {
            .masonry-gallery {
                grid-template-columns: 1fr;
            }
        }
        
        .gallery-item {
            background: #2c3e50; /* Darker background for cards */
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: white; /* White text for cards */
        }
        
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .gallery-icon {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        
        .gallery-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover .gallery-icon img {
            transform: scale(1.05);
        }
        
        .gallery-caption {
            padding: 1.5rem;
        }
        
        .entry-summary h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: white; /* White text for headings */
        }
        
        .entry-summary p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.8); /* Slightly transparent white for text */
        }
        
        .punchline {
            font-style: italic;
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            gap: 1rem;
        }
        
        .pagination a {
            padding: 0.5rem 1rem;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 0.25rem;
            transition: background-color 0.3s ease;
        }
        
        .pagination a:hover {
            background-color: #1a252f;
        }
        
        .image-source {
            text-align: center;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 2rem;
        }
        
        .image-source a {
            color: #4f46e5;
            text-decoration: none;
        }
        
        .image-source a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="gallery">
    <section id="content" role="main">
        <div class="wrapper">
            <h2>{{page.title}}</h2>
            
            <!-- First row of projects -->
            <div class="gallery masonry-gallery">
                {% for image in page.images limit:2 %}
                <figure class="gallery-item">
                    <header class="gallery-icon">
                        <a href="{{ site.url }}{{ site.baseurl }}{{ image.gallery-folder }}">
                            <img src="{{ site.url }}{{ site.baseurl }}{{ image.image_path }}" alt="{{ image.gallery-name }}">
                        </a>
                    </header>
                    <figcaption class="gallery-caption">
                        <div class="entry-summary">
                            <h3>{{image.gallery-name}}</h3>
                            <p>{{image.gallery-date}}</p>
                            <p class="punchline">A brief description of this project goes here.</p>
                        </div>
                    </figcaption>
                </figure>
                {% endfor %}
            </div>
            
            <!-- Second row of projects -->
            <div class="gallery masonry-gallery">
                {% for image in page.images offset:2 limit:2 %}
                <figure class="gallery-item">
                    <header class="gallery-icon">
                        <a href="{{ site.url }}{{ site.baseurl }}{{ image.gallery-folder }}">
                            <img src="{{ site.url }}{{ site.baseurl }}{{ image.image_path }}" alt="{{ image.gallery-name }}">
                        </a>
                    </header>
                    <figcaption class="gallery-caption">
                        <div class="entry-summary">
                            <h3>{{image.gallery-name}}</h3>
                            <p>{{image.gallery-date}}</p>
                            <p class="punchline">A brief description of this project goes here.</p>
                        </div>
                    </figcaption>
                </figure>
                {% endfor %}
            </div>
            
            <!-- Pagination -->
            <div class="pagination">
                <a href="#" class="previous">Previous</a>
                <a href="#" class="next">Next</a>
            </div>
        </div>
    </section>

    <div class="image-source">
        <p>Image Source: <a href="https://unsplash.com/photos/YOT6kS8YtEA/">Unsplash</a></p>
    </div>

    <script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script src="{{ site.baseurl }}/js/retina.min.js"></script>
    <script src="{{ site.baseurl }}/js/isotope.pkgd.min.js"></script>
    <script src="{{ site.baseurl }}/js/jquery.mousewheel.min.js"></script>
    <script src="{{ site.baseurl }}/js/jquery.tinycarousel.min.js"></script>
    <script src="{{ site.baseurl }}/js/jquery.lazylinepainter.min.js"></script>
    <script src="{{ site.baseurl }}/js/scripts.js"></script>
    <script src="{{ site.baseurl }}/js/modernizr.js"></script>
</body>
</html>
