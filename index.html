<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep - Photorama</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      color: white;
      overflow: auto;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .logo {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 2;
      animation: fadeInTop 1s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 3;
    }

    nav {
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
      animation: fadeInTop 1s ease forwards;
      animation-delay: 0.5s;
      opacity: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      -webkit-text-stroke: 0.6px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 0 1rem;
      animation: fadeInUp 1.5s ease forwards;
      animation-delay: 1s;
      opacity: 0;
    }

    .main-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .main-content p {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 1s ease;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      -webkit-text-stroke: 0.4px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      nav {
        display: flex !important;
        position: absolute;
        top: 20px;
        right: 30px;
        background: none;
        flex-direction: row;
        gap: 25px;
        padding: 0;
      }
    }

    @media (max-width: 480px) {
      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .social-icons a {
        font-size: 1.2rem;
      }

      .logo img {
        height: 40px;
      }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInTop {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <div class="logo">
    <img src="logo.png" alt="Logo" />
  </div>

  <button class="hamburger" onclick="toggleNav()">
    <i class="fas fa-bars"></i>
  </button>

  <nav id="mobileNav">
    <a href="gallery/">PROJECTS</a>
    <a href="journal/">BLOG</a>
    <a href="about/">ABOUT ME</a>
  </nav>

  <div class="main-content">
    <h1 id="typewriter">Hi, I’m <span id="name"></span></h1>
    <p id="subtitle">CS Grad<br>and more</p>

    <div class="social-icons">
      <a href="https://wa.me/7588643764" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://instagram.com/chillbandar" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://linkedin.com/in/amay-deep-34158b229" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/XiaoPongo" target="_blank"><i class="fab fa-github"></i></a>
      <a href="mailto:amaydeepp12510@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    });

    function toggleNav() {
      const nav = document.getElementById("mobileNav");
      nav.style.display = nav.style.display === "flex" ? "none" : "flex";
    }

    const nameSpan = document.getElementById("name");
    const subtitle = document.getElementById("subtitle");
    const names = ["Amay", "Deep"];
    let nameIndex = 0;
    let charIndex = 0;
    let typing = true;

    function typeLoop() {
      if (typing) {
        if (charIndex < names[nameIndex].length) {
          nameSpan.textContent += names[nameIndex][charIndex++];
          setTimeout(typeLoop, 250);
        } else {
          setTimeout(() => {
            typing = false;
            setTimeout(typeLoop, 800);
          }, 1500);
        }
      } else {
        if (charIndex > 0) {
          nameSpan.textContent = nameSpan.textContent.slice(0, --charIndex);
          setTimeout(typeLoop, 120);
        } else {
          nameIndex = (nameIndex + 1) % names.length;
          typing = true;
          setTimeout(typeLoop, 800);
        }
      }
    }

    window.onload = () => {
      setTimeout(() => {
        typeLoop();
        subtitle.style.opacity = 1;
      }, 2000);
    };
  </script>
</body>
</html>
