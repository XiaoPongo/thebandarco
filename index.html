<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep - Photorama</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      overflow: hidden;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* Logo image */
    .logo {
      position: absolute;
      top: 20px;
      left: 30px;
      z-index: 2;
    }

    .logo img {
      height: 50px;
      width: auto;
    }

    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
    }

    nav a {
      color: white;
      margin-left: 25px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: opacity 0.3s;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000,
                   -1px 1px 0 #000, 1px 1px 0 #000;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: white;
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .main-content h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000,
                   -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .main-content p {
      font-size: 1.25rem;
      margin-top: 0.5rem;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000,
                   -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      gap: 30px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000,
                   -1px 1px 0 #000, 1px 1px 0 #000;
      transition: transform 0.3s;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (max-width: 600px) {
      nav a {
        margin-left: 15px;
        font-size: 0.9rem;
      }

      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .logo img {
        height: 40px;
      }

      .social-icons a {
        font-size: 1.2rem;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- VANTA Background -->
  <div id="vanta-bg"></div>

  <!-- Logo image -->
  <div class="logo">
    <img src="logo.png" alt="Logo" />
  </div>

  <!-- Navbar -->
  <nav>
    <a href="projects.html">PROJECTS</a>
    <a href="blog.html">BLOG</a>
    <a href="about.html">ABOUT ME</a>
  </nav>

  <!-- Centered Main Text -->
  <div class="main-content">
    <h1>Hi, I’m Deep</h1>
    <p>CS Grad<br>and more</p>

    <!-- Social Icons Below Sub Text -->
    <div class="social-icons">
      <a href="#"><i class="fab fa-whatsapp"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="mailto:youremail@example.com"><i class="fas fa-envelope"></i></a>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    })
  </script>

</body>
</html>
