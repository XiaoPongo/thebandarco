<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep - Photorama</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      color: white;
      overflow: auto;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .logo {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 2;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 3;
    }

    nav {
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      -webkit-text-stroke: 0.6px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 0 1rem;
    }

    .main-content h1, .main-content p {
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .main-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .main-content p {
      font-size: 1.3rem;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      -webkit-text-stroke: 0.4px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      nav {
        display: flex !important;
        position: absolute;
        top: 20px;
        right: 30px;
        background: none;
        flex-direction: row;
        gap: 25px;
        padding: 0;
      }
    }

    @media (max-width: 480px) {
      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .social-icons a {
        font-size: 1.2rem;
      }

      .logo img {
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <div id="vanta-bg"></div>

  <div class="logo">
    <img src="logo.png" alt="Logo" />
  </div>

  <button class="hamburger" onclick="toggleNav()">
    <i class="fas fa-bars"></i>
  </button>

  <nav id="mobileNav">
    <a href="gallery/">PROJECTS</a>
    <a href="journal/">BLOG</a>
    <a href="about/">ABOUT ME</a>
  </nav>

  <div class="main-content">
    <h1>Hi, I’m Deep</h1>
    <p>CS Grad<br>and more</p>

    <div class="social-icons" id="socialLinks">
      <!-- Social Icons Injected Here -->
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    });

    function toggleNav() {
      const nav = document.getElementById("mobileNav");
      nav.style.display = nav.style.display === "flex" ? "none" : "flex";
    }

    fetch('_config.yml')
      .then(response => response.text())
      .then(yamlText => {
        const config = jsyaml.load(yamlText);

        const socialLinks = {
          whatsapp: config.whatsapp_number ? `https://wa.me/7588643764` : null,
          instagram: config.instagram_username ? `https://instagram.com/chillbandar` : null,
          linkedin: config.linkedin_username ? `https://linkedin.com/in/amay-deep-34158b229` : null,
          github: config.github_username ? `https://github.com/XiaoPongo` : null,
          email: config.email ? `mailto:amaydeepp12510@gmail.com` : null
        };

        const icons = {
          whatsapp: 'fab fa-whatsapp',
          instagram: 'fab fa-instagram',
          linkedin: 'fab fa-linkedin',
          github: 'fab fa-github',
          email: 'fas fa-envelope'
        };

        const container = document.getElementById('socialLinks');
        for (let key in socialLinks) {
          if (socialLinks[key]) {
            const a = document.createElement('a');
            a.href = socialLinks[key];
            a.target = "_blank";
            a.innerHTML = `<i class="${icons[key]}"></i>`;
            container.appendChild(a);
          }
        }
      });
  </script>
</body>
</html>
