<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep - Photorama</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      overflow: hidden;
      color: white;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 30px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .logo img {
      height: 50px;
      width: auto;
      display: block;
    }

    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
    }

    nav a {
      color: white;
      margin-left: 25px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: opacity 0.3s;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 10px;
      border-radius: 5px;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .main-content h1, .main-content p {
      margin: 0.5rem 0;
      padding: 0 1rem;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
    }

    .main-content h1 {
      font-size: 3rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px #000;
    }

    .main-content p {
      font-size: 1.5rem;
      text-shadow: 1px 1px 2px #000;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      gap: 30px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 50%;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (max-width: 600px) {
      nav a {
        margin-left: 15px;
        font-size: 0.9rem;
      }

      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .logo img {
        height: 40px;
      }

      .social-icons a {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div id="vanta-bg"></div>

  <div class="logo">
    <img src="logo.png" alt="Logo" />
  </div>

  <nav>
    <a href="gallery/">PROJECTS</a>
    <a href="journal/">BLOG</a>
    <a href="about/">ABOUT ME</a>
  </nav>

  <div class="main-content">
    <h1>Hi, I’m Deep</h1>
    <p>CS Grad<br>and more</p>

    <div class="social-icons" id="socialLinks">
      <!-- Will populate from config.yml -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    });

    // Load config.yml and populate icons
    fetch('config.yml')
      .then(response => response.text())
      .then(yamlText => {
        const config = YAML.parse(yamlText);
        const links = config.social;
        const icons = {
          whatsapp: 'fab fa-whatsapp',
          instagram: 'fab fa-instagram',
          linkedin: 'fab fa-linkedin',
          github: 'fab fa-github',
          email: 'fas fa-envelope'
        };
        const container = document.getElementById('socialLinks');
        for (let key in links) {
          const a = document.createElement('a');
          a.href = links[key];
          a.target = "_blank";
          a.innerHTML = `<i class="${icons[key]}"></i>`;
          container.appendChild(a);
        }
      });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</body>
</html>
