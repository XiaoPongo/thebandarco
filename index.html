<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome - The Bandar Co.</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      color: white;
      overflow: auto;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .logo {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.5s;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 3;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.7s;
    }

    nav {
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.9s;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      -webkit-text-stroke: 0.6px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 0 1rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards 2.5s;
    }

    .main-content h1, .main-content p {
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .main-content h1 {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .typed-text {
      display: inline;
      border-right: 2px solid transparent;
      /* cursor handled by ::after */
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      vertical-align: bottom;
    }

    .typed-text::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
      position: relative;
      left: 2px;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }

    .main-content p {
      font-size: 1.3rem;
      font-weight: 700; /* <-- Make subtext thicker */
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.2s;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.5s;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      -webkit-text-stroke: 0.4px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      nav {
        display: flex !important;
        position: absolute;
        top: 20px;
        right: 30px;
        background: none;
        flex-direction: row;
        gap: 25px;
        padding: 0;
        opacity: 1;
        animation: none;
      }
    }

    @media (max-width: 480px) {
      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }

      .social-icons a {
        font-size: 1.2rem;
      }

      .logo img {
        height: 40px;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="vanta-bg"></div>

  <div class="logo">
    <img src="logo.png" alt="Logo" />
  </div>

  <button class="hamburger" onclick="toggleNav()">
    <i class="fas fa-bars"></i>
  </button>

  <nav id="mobileNav">
    <a href="projects/">PROJECTS</a>
    <a href="blog/">BLOG</a>
    <a href="about/">ABOUT ME</a>
  </nav>

  <div class="main-content">
    <h1>Hi, I’m <span class="typed-text"></span></h1>
    <p>B.Com. Grad<br>and more</p>

    <div class="social-icons">
      <a href="https://wa.me/7588643764" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://instagram.com/chillbandar" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://linkedin.com/in/amay-deep-34158b229" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/XiaoPongo" target="_blank"><i class="fab fa-github"></i></a>
      <a href="mailto:amaydeepp12510@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    });

    function toggleNav() {
      const nav = document.getElementById("mobileNav");
      nav.style.display = nav.style.display === "flex" ? "none" : "flex";
    }

    // Typing animation script with smooth human-like speed
    const typedTextSpan = document.querySelector(".typed-text");
    const texts = ["Amay", "Deep."];
    const typingDelay = 200;
    const erasingDelay = 120;
    const newTextDelay = 1200; // Delay before typing next word
    let textIndex = 0;
    let charIndex = 0;

    function type() {
      if (charIndex < texts[textIndex].length) {
        typedTextSpan.textContent += texts[textIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, typingDelay + Math.random() * 100); // Slight random delay for human effect
      } else {
        setTimeout(erase, newTextDelay);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typedTextSpan.textContent = texts[textIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, erasingDelay + Math.random() * 100);
      } else {
        textIndex++;
        if (textIndex >= texts.length) textIndex = 0;
        setTimeout(type, typingDelay + 500);
      }
    }

    document.addEventListener("DOMContentLoaded", function() { // Start after DOM ready and fade-ins
      setTimeout(type, 3000); // Start typing after fade-in animations (~3 seconds)
    });
  </script>
</body>
</html>
