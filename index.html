    html, body {
      margin: 0;

    #vanta-bg {

    .hamburger {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 3;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.7s;
    }

    nav {
      display: none;
      flex-direction: column;
      gap: 10px;
      position: absolute;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      opacity: 0;
      z-index: 2;
      animation: fadeIn 2s ease forwards 1.9s;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      -webkit-text-stroke: 0.6px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      z-index: 1;
      position: relative;
      padding: 0 1rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards 2.5s;
    }

    .main-content h1, .main-content p {
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      word-wrap: break-word;
    }

    .main-content h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .typed-text {
      display: inline;
      border-right: 2px solid transparent;
      position: relative;
      white-space: normal;
      overflow: hidden;
      vertical-align: bottom;
    }

    .typed-text::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: white;
      font-weight: bold;
      font-size: 1.2em;
      position: relative;
      left: 2px;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }

    .main-content p {
      font-size: 1rem;
      font-weight: 700;
      margin: 0.5rem 0;
      -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.2s;
      line-height: 1.4;
    }

    .social-icons {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 2s ease forwards 3.5s;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
      transition: transform 0.3s;
      -webkit-text-stroke: 0.4px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }

      nav {
        display: flex;
        position: absolute;
        top: 20px;
        right: 30px;
        background: none;
        flex-direction: row;
        gap: 25px;
        padding: 0;
        opacity: 0;
        animation: fadeIn 2s ease forwards 1.9s;
      }

      .main-content h1 {
        font-size: 2.5rem;
      }

      .main-content p {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 480px) {
      .logo {
        left: 20px;
      }

      .main-content {
        padding: 0 0.5rem;
      }

      .main-content h1 {
        font-size: 1.5rem;
        max-width: 100%;
      }

      .main-content p {
        font-size: 0.9rem;
        max-width: 100%;
      }

      .typed-text {
        font-size: 1.5rem;
      }

      .typed-text::after {
        font-size: 1em;
      }

      .social-icons {
        gap: 10px;
      }

      .social-icons a {
        font-size: 1.2rem;
      }

      .logo img {
        height: 35px;
      }

      .hamburger {
        font-size: 1.5rem;
        top: 15px;

      }

      nav.popup {

        right: 15px;
        padding: 8px 12px;
      }

      nav a {
        font-size: 0.9rem;
      }
    }

    @keyframes fadeIn {

    nav.popup {

      flex-direction: column;

      right: 20px;

      transition: opacity 0.3s ease;

  <script>
    // Vanta.js initialization
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    });

    // Rest of your existing JS remains unchanged
    function toggleNav() {
      const nav = document.getElementById("mobileNav");

      if (nav.classList.contains("show")) {
        nav.classList.remove("show");
        setTimeout(() => {
          nav.classList.remove("popup");
          nav.style.display = "none";
        }, 300);
      } else {
        nav.classList.add("popup");
        nav.style.display = "flex";
        setTimeout(() => {
          nav.classList.add("show");
        }, 10);
      }
    }

    const typedTextSpan = document.querySelector(".typed-text");
    const textArray = ["Amay Deep.", "an Amateur Designer.", "a part-time Writer.", "a Vibe Coder." ];
    const typingDelay = 100;
    const erasingDelay = 50;
    const newTextDelay = 2000;
    let textArrayIndex = 0;
    let charIndex = 0;

    function type() {
      if (charIndex < textArray[textArrayIndex].length) {
        typedTextSpan.textContent += textArray[textArrayIndex].charAt(charIndex);
        charIndex++;
        setTimeout(type, typingDelay);
      } else {
        setTimeout(erase, newTextDelay);
      }
    }

    function erase() {
      if (charIndex > 0) {
        typedTextSpan.textContent = textArray[textArrayIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(erase, erasingDelay);
      } else {
        textArrayIndex++;
        if (textArrayIndex >= textArray.length) textArrayIndex = 0;
        setTimeout(type, typingDelay + 1100);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (textArray.length) setTimeout(type, newTextDelay + 250);
    });
  </script>
