<!DOCTYPE html>
<html lang="en">
<head>
  <title>Welcome - The Bandar Co.</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preconnect to speed up Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Open Sans', sans-serif; color: white; overflow: auto;
    }
    #vanta-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }
    .logo {
      position: absolute; top: 15px; left: 40px; opacity: 0;
      animation: fadeIn 2s ease forwards 1.5s;
    }
    .logo img { height: 45px; width: auto; }
    .hamburger {
      position: absolute; top: 20px; right: 20px; background: none;
      border: none; cursor: pointer; opacity: 0; color: white;
      animation: fadeIn 2s ease forwards 1.7s;
    }
    nav {
      display: none; flex-direction: column; gap: 10px; position: absolute;
      top: 70px; right: 20px; padding: 10px 15px; background: rgba(0,0,0,0.7);
      border-radius: 10px; opacity: 0; animation: fadeIn 2s ease forwards 1.9s;
    }
    nav a {
      color: white; text-decoration: none; font-weight: 700; font-size: 1rem;
      -webkit-text-stroke: 0.6px black; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }
    nav a:hover { opacity: 0.7; }
    .main-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 0 1rem; opacity: 0; text-align: center;
      animation: fadeIn 2s ease forwards 2.5s;
    }
    .main-content h1, .main-content p {
      margin: 0.5rem 0; -webkit-text-stroke: 0.8px black;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8); color: white;
    }
    .main-content h1 { font-size: 2rem; }
    .main-content p { font-size: 1rem; font-weight: 700; }
    .typed-text::after {
      content: '|'; animation: blink 0.8s infinite; color: white; font-weight: bold;
    }
    @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
    .social-icons {
      margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center;
      gap: 15px; opacity: 0; animation: fadeIn 2s ease forwards 3.5s;
    }
    .social-icons a { width:24px; height:24px; color:white; }
    @keyframes fadeIn { to { opacity:1 } }
    @media (min-width:768px) {
      .hamburger { display:none; }
      nav { position:absolute; top:20px; right:30px; flex-direction:row; background:none; padding:0; opacity:0; animation: fadeIn 2s ease forwards 1.9s; }
      .main-content h1 { font-size:2.5rem; }
      .main-content p { font-size:1.3rem; }
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div class="logo"><img src="logo.png" alt="Logo"></div>

  <!-- Accessible nav toggle -->
  <button class="hamburger" aria-label="Toggle navigation menu" onclick="toggleNav()">
    <!-- Hamburger icon as SVG -->
    <svg viewBox="0 0 448 512" width="24" height="24" fill="white"><path d="M16 132h416v40H16zm0 128h416v40H16zm0 128h416v40H16z"/></svg>
  </button>

  <nav id="mobileNav">
    <a href="projects/">PROJECTS</a>
    <a href="blog/">BLOG</a>
    <a href="about/">ABOUT ME</a>
  </nav>

  <div class="main-content">
    <h1>Hi, I’m <span class="typed-text"></span></h1>
    <p>B.Com. Grad<br>and more</p>
    <div class="social-icons">
      <a href="https://wa.me/7588643764" target="_blank" aria-label="WhatsApp">
        <svg viewBox="0 0 448 512" width="24" height="24" fill="white"><path d="M..."/></svg>
      </a>
      <a href="https://instagram.com/chillbandar" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 448 512" width="24" height="24" fill="white"><path d="M..."/></svg>
      </a>
      <a href="https://linkedin.com/in/amay-deep-34158b229" target="_blank" aria-label="LinkedIn">
        <svg viewBox="0 0 448 512" width="24" height="24" fill="white"><path d="M..."/></svg>
      </a>
      <a href="https://github.com/XiaoPongo" target="_blank" aria-label="GitHub">
        <svg viewBox="0 0 448 512" width="24" height="24" fill="white"><path d="M..."/></svg>
      </a>
      <a href="mailto:amaydeepp12510@gmail.com" target="_blank" aria-label="Email">
        <svg viewBox="0 0 512 512" width="24" height="24" fill="white"><path d="M..."/></svg>
      </a>
    </div>
  </div>

  <!-- Optimized scripts -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      VANTA.TOPOLOGY({ el: "#vanta-bg", color: 0xffffff, backgroundColor: 0x000000 });

      // Toggle Nav
      const nav = document.getElementById('mobileNav');
      window.toggleNav = () => {
        if (nav.classList.contains('show')) {
          nav.classList.remove('show'); setTimeout(() => { nav.classList.remove('popup'); nav.style.display='none'; }, 300);
        } else {
          nav.classList.add('popup'); nav.style.display='flex';
          setTimeout(() => nav.classList.add('show'), 10);
        }
      };

      // Typed Text Animation
      const typedTextSpan = document.querySelector(".typed-text");
      const textArray = ["Amay Deep.", "an Amateur Designer.", "a part-time Writer.", "an AI-assisted Developer." ];
      let textArrayIndex = 0, charIndex = 0;
      const typingDelay = 100, erasingDelay = 50, newTextDelay = 2000;

      function type() {
        if (charIndex < textArray[textArrayIndex].length) {
          typedTextSpan.textContent += textArray[textArrayIndex].charAt(charIndex++); setTimeout(type, typingDelay);
        } else { setTimeout(erase, newTextDelay); }
      }
      function erase() {
        if (charIndex > 0) {
          typedTextSpan.textContent = textArray[textArrayIndex].substring(0, charIndex--); setTimeout(erase, erasingDelay);
        } else { textArrayIndex = (textArrayIndex + 1) % textArray.length; setTimeout(type, typingDelay + 1100); }
      }
      setTimeout(type, newTextDelay + 250);
    });
  </script>
</body>
</html>
