<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photorama - Deep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS Styling -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Open Sans', sans-serif;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }

    #content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: left;
      height: 100vh;
      color: white;
    }

    .wrapper {
      max-width: 600px;
      padding: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.25rem;
      color: #dddddd;
      margin-top: 0;
    }

    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-left: 20px;
    }

    .social-icons {
      position: absolute;
      bottom: 20px;
      right: 30px;
      display: flex;
      gap: 15px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.5rem;
      text-decoration: none;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 30px;
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- VANTA Background -->
  <div id="vanta-bg"></div>

  <!-- Top Navigation -->
  <div class="logo">PHOTORAMA</div>
  <nav>
    <a href="#projects">PROJECTS</a>
    <a href="#blog">BLOG</a>
    <a href="#about">ABOUT ME</a>
  </nav>

  <!-- Main Content -->
  <div id="content">
    <div class="wrapper">
      <h1>Hi, I’m Deep</h1>
      <p>CS Grad<br>and more</p>
    </div>
  </div>

  <!-- Footer Social Icons (fontawesome needed if you want icons) -->
  <div class="social-icons">
    <a href="#"><span>&#xf09a;</span></a> <!-- Facebook -->
    <a href="#"><span>&#xf099;</span></a> <!-- Twitter -->
    <a href="#"><span>&#xf16d;</span></a> <!-- Instagram -->
    <a href="#"><span>&#xf0c6;</span></a> <!-- Flickr -->
    <a href="#"><span>&#xf1bd;</span></a> <!-- DeviantArt -->
    <a href="#"><span>&#xf09b;</span></a> <!-- GitHub -->
    <a href="#"><span>&#xf0e0;</span></a> <!-- Email -->
  </div>

  <!-- Scripts for VANTA -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      VANTA.TOPOLOGY({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0xffffff,
        backgroundColor: 0x111111
      });
    });
  </script>

</body>
</html>
