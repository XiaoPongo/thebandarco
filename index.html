<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deep - Photorama</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- FontAwesome (for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      overflow: hidden;
    }

    /* Background */
    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      z-index: 2;
    }

    /* Navbar */
    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
    }

    nav a {
      color: white;
      margin-left: 25px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* Centered Content */
    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: white;
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .main-content h1 {
      font-size: 3rem;
      margin: 0;
    }

    .main-content p {
      font-size: 1.25rem;
      margin-top: 0.5rem;
    }

    /* Social Icons */
    .social-icons {
      position: absolute;
      bottom: 20px;
      right: 30px;
      display: flex;
      gap: 20px;
      z-index: 2;
    }

    .social-icons a {
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      nav a {
        margin-left: 15px;
        font-size: 0.9rem;
      }

      .main-content h1 {
        font-size: 2rem;
      }

      .main-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- VANTA Topology Background -->
  <div id="vanta-bg"></div>

  <!-- Logo -->
  <div class="logo">PHOTORAMA</div>

  <!-- Navigation -->
  <nav>
    <a href="projects.html">PROJECTS</a>
    <a href="blog.html">BLOG</a>
    <a href="about.html">ABOUT ME</a>
  </nav>

  <!-- Centered Main Text -->
  <div class="main-content">
    <h1>Hi, I’m Deep</h1>
    <p>CS Grad<br>and more</p>
  </div>

  <!-- Social Icons (with Font Awesome) -->
  <div class="social-icons">
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-flickr"></i></a>
    <a href="#"><i class="fab fa-deviantart"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
    <a href="mailto:youremail@example.com"><i class="fas fa-envelope"></i></a>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script>
    VANTA.TOPOLOGY({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffffff,
      backgroundColor: 0x000000
    })
  </script>

</body>
</html>
