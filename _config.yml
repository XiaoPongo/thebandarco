# Settings for comments helper
comments :
  provider : disqus
  disqus :
    short_name : ""

# Internal nav
nav:
  - PROJECTS: "/projects/"  
  - BLOG: "/blog/"
  - ABOUT ME: "/about/"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 6
paginate_path: "/blog/page:num/"
permalink: "/blog/:title/"

# Collections for tags and categories
collections:
  tags:
    output: true
    permalink: /blog/tag/:name/
  categories:
    output: true
    permalink: /blog/category/:name/

# Path configurations
categories_path: "/blog/category/"
tags_path: "/blog/tag/"

# Plugins
gems: 
  - jekyll-paginate
  - jekyll-tagging

exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"
