<div class="post-share text-center">
    <p class="light small">
        <h6>Share this post</h6>
    </p>
    <ul class="social-mini">
        <li>
            <a href="https://www.instagram.com/?url={{ site.url }}{{ page.url }}"
               onclick="window.open(this.href, 'instagram-share', 'width=550,height=235');return false;" 
               data-toggle="tooltip" 
               title="Share on Instagram" 
               itemprop="Instagram">
                <span class="fa-stack fa-lg" style="color: #223333; font-size: 1em;">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-instagram fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
        <li>
            <a href="https://api.whatsapp.com/send?text={{ page.title }}%20{{ site.url }}{{ page.url }}"
               onclick="window.open(this.href, 'whatsapp-share', 'width=550,height=235');return false;" 
               data-toggle="tooltip" 
               title="Share on WhatsApp" 
               itemprop="WhatsApp">
                <span class="fa-stack fa-lg" style="color: #223333; font-size: 1em;">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-whatsapp fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
        <li>
            <a href="javascript:void(0)"
               onclick="navigator.share ? navigator.share({title: '{{ page.title }}', url: '{{ site.url }}{{ page.url }}'}).catch(console.error) : alert('Share feature not supported. Copy the URL: {{ site.url }}{{ page.url }}');" 
               data-toggle="tooltip" 
               title="Share on Any Platform" 
               itemprop="GenericShare">
                <span class="fa-stack fa-lg" style="color: #223333; font-size: 1em;">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-share-alt fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
    </ul>
</div>
