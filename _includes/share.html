<div class="post-share text-center">
    <p class="light small">
        <h6>Share this post</h6>
    </p>
    <style>
        .social-mini {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-mini li {
            display: inline-block;
        }
        .social-mini a {
            text-decoration: none;
            outline: none; /* Remove purple outline on click */
        }
        .social-mini .fa-stack {
            transition: all 0.3s ease; /* Smooth transition for hover effects */
            background: linear-gradient(135deg, #444444, #222222); /* Gradient background */
            border-radius: 50%;
            width: 2.5em;
            height: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-mini .fa-stack:hover {
            transform: scale(1.1); /* Slight scale on hover */
            background: linear-gradient(135deg, #666666, #333333); /* Lighter gradient on hover */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); /* Subtle shadow on hover */
        }
        .social-mini .fa-circle {
            color: transparent; /* Hide the circle, using gradient background instead */
        }
        .social-mini .fa-stack-1x {
            color: #ffffff; /* White icons for contrast */
            font-size: 1.2em; /* Slightly larger icons */
        }
    </style>
    <ul class="social-mini">
        <li>
            <a href="https://www.instagram.com/?url={{ site.url }}{{ page.url }}"
               onclick="window.open(this.href, 'instagram-share', 'width=550,height=235');return false;" 
               data-toggle="tooltip" 
               title="Share on Instagram" 
               itemprop="Instagram">
                <span class="fa-stack fa-lg">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-instagram fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
        <li>
            <a href="https://api.whatsapp.com/send?text={{ page.title }}%20{{ site.url }}{{ page.url }}"
               onclick="window.open(this.href, 'whatsapp-share', 'width=550,height=235');return false;" 
               data-toggle="tooltip" 
               title="Share on WhatsApp" 
               itemprop="WhatsApp">
                <span class="fa-stack fa-lg">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-whatsapp fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
        <li>
            <a href="javascript:void(0)"
               onclick="navigator.share ? navigator.share({title: '{{ page.title }}', url: '{{ site.url }}{{ page.url }}'}).catch(console.error) : alert('Share feature not supported. Copy the URL: {{ site.url }}{{ page.url }}');" 
               data-toggle="tooltip" 
               title="Share on Any Platform" 
               itemprop="GenericShare">
                <span class="fa-stack fa-lg">
                    <i class="fa fa-circle fa-stack-2x"></i>
                    <i class="fa fa-share-alt fa-stack-1x fa-inverse"></i>
                </span>
            </a>
        </li>
    </ul>
</div>
