<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="{{ site.baseurl }}/" class="logo">
      <img src="{{ site.baseurl }}/logo.png" alt="logo" style="height: 50px;">
    </a>
    
    <!-- Single Navigation Links Section -->
    <ul class="nav-links">
      {% for nav_hash in site.nav %}
        {% for nav_item in nav_hash %}
          {% assign lowercase_nav_item = nav_item[0] | downcase %}
          <li {% if page.active == lowercase_nav_item %}class="active"{% endif %}>
            <a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>
    
    <!-- Search Button -->
    <div class="search-container">
      <a href="javascript:void(0)" title="Search" onclick="superSearch.toggle()" class="super-search-btn">
        <span class="fa fa-search"></span>
      </a>
    </div>
    
    <!-- Mobile Menu Button -->
    <button class="hamburger">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<style>
  /* Ensure single instance of nav items */
  .nav-links {
    display: flex;
    list-style: none;
    margin: 0 auto;
    padding: 0;
  }
  
  /* Hide duplicate nav items */
  .navbar-container > ul:not(.nav-links) {
    display: none !important;
  }
</style>
