<!-- Navigation -->
<style>
  .navbar-nav > li > a {
    color: white !important;
    text-shadow: none !important;
  }

  .navbar-nav > li > a:hover,
  .navbar-nav > li.active > a:hover {
    color: #a020f0 !important;
  }

  .navbar-nav > li.active > a {
    color: white !important;
  }

  .navbar {
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
    background-color: rgba(62,195,246, 0); /* start transparent */
    box-shadow: none;
  }

  .small-logo-container {
    padding-top: 50px;
    transition: padding-top 0.3s ease;
  }

  .small-logo {
    height: 40px;
    transition: height 0.3s ease;
  }

  .big-logo {
    height: 120px;
  }
</style>

<nav class="navbar navbar-default navbar-custom navbar-fixed-top" style="margin-right:1em; z-index: 1000;">
  <div class="container-fluid">
    <div class="navbar-header page-scroll small-logo-container">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
        <i class="fa fa-bars fa-lg"></i>
      </button>
      <a href="{{ site.baseurl }}/" title="HOME">
        <img src="{{ site.baseurl }}/logo.png" alt="logo" class="small-logo big-logo" style="cursor:pointer;" />
      </a>
    </div>

    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right" style="margin-right:1em;">
        {% for nav_hash in site.nav %}
          {% for nav_item in nav_hash %}
            {% assign lowercase_nav_item = nav_item[0] | downcase %}
            {% if page.active == lowercase_nav_item %}
              <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% else %}
              <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% endif %}
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>

<!-- Fade + Shrink Navbar Script -->
<script>
  $(document).ready(function () {
    var navbarHeight = $('.navbar').outerHeight();
    var smallLogo = $('.small-logo');
    var smallLogoHeight = smallLogo.height();
    var bigLogoHeight = 120; // hardcoded to match CSS .big-logo

    $(window).on('scroll', function () {
      var yScroll = $(window).scrollTop();
      var scrollRatio = yScroll / bigLogoHeight;
      var opacity = Math.min(scrollRatio, 1);

      // Change navbar background
      $('.navbar').css({
        "background-color": "rgba(62,195,246," + opacity + ")"
      });

      // Shadow when scrolled
      if (yScroll > 1) {
        $('.navbar').css("box-shadow", "0 2px 3px rgba(0,0,0," + (opacity * 0.4) + ")");
      } else {
        $('.navbar').css("box-shadow", "none");
      }

      // Logo shrink effect
      var smallSpeed = (smallLogoHeight / bigLogoHeight);
      var ySmall = yScroll * smallSpeed;
      var padding = navbarHeight - ySmall;
      padding = Math.max(0, Math.min(padding, navbarHeight));

      $('.small-logo-container').css("padding-top", padding);
    });
  });
</script>
