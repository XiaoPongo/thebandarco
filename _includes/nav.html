<!-- Navigation -->
<style>
  .navbar-nav > li > a {
    color: white !important;
    text-shadow: none !important;
  }

  .navbar-nav > li > a:hover,
  .navbar-nav > li.active > a:hover {
    color: #a020f0 !important; /* Purple on hover */
  }

  .navbar-nav > li.active > a {
    color: white !important; /* Default active color */
  }
  
  /* Add this to make navbar fixed and ensure proper z-index */
  .navbar-custom {
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
  }
  
  /* Style for white hamburger icon */
  .navbar-toggle {
    border: none;
  }
  
  .navbar-toggle .icon-bar {
    background-color: white;
  }
  
  .navbar-toggle:hover .icon-bar {
    background-color: #a020f0; /* Purple on hover */
  }
</style>

<nav class="navbar navbar-default navbar-custom">
  <div class="container-fluid">
    <div class="navbar-header page-scroll">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a href="{{ site.baseurl }}/" title="HOME">
        <img src="{{ site.baseurl }}/logo.png" alt="logo" style="width:150px;cursor:pointer;margin-top:15px;" />
      </a>
    </div>

    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right" style="margin-right:1em;">
        {% for nav_hash in site.nav %}
          {% for nav_item in nav_hash %}
            {% assign lowercase_nav_item = nav_item[0] | downcase %}
            {% if page.active == lowercase_nav_item %}
              <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% else %}
              <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% endif %}
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
