<!-- Navigation -->
<style>
  .navbar-nav > li > a {
    color: white !important;
    text-shadow: none !important;
  }

  .navbar-nav > li > a:hover,
  .navbar-nav > li.active > a:hover {
    color: #a020f0 !important;
  }

  .navbar-nav > li.active > a {
    color: white !important;
  }

  .scroll-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: none;
    background-color: rgba(16, 48, 11, 0.95);
    z-index: 9999; /* Make sure it's on top of vanta header */
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .scroll-nav .navbar-header img {
    width: 120px;
    margin-top: 10px;
  }

  .scroll-nav .navbar-toggle {
    margin-top: 15px;
  }
</style>

<!-- Scroll Navbar -->
<nav id="scrolling-navbar" class="navbar navbar-default navbar-custom scroll-nav">
  <div class="container-fluid">
    <div class="navbar-header page-scroll">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#scroll-navbar-collapse">
        <i class="fa fa-bars fa-lg"></i>
      </button>
      <a href="{{ site.baseurl }}/" title="HOME">
        <img src="{{ site.baseurl }}/logo.png" alt="logo" />
      </a>
    </div>

    <div class="collapse navbar-collapse" id="scroll-navbar-collapse">
      <ul class="nav navbar-nav navbar-right" style="margin-right:1em;">
        {% for nav_hash in site.nav %}
          {% for nav_item in nav_hash %}
            {% assign lowercase_nav_item = nav_item[0] | downcase %}
            {% if page.active == lowercase_nav_item %}
              <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% else %}
              <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% endif %}
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>

<script>
  function toggleScrollNavbar() {
    const scrollNav = document.getElementById('scrolling-navbar');
    const showAfter = 400; // Adjust to match vanta header height
    if (window.scrollY > showAfter) {
      scrollNav.style.display = 'block';
    } else {
      scrollNav.style.display = 'none';
    }
  }

  // Run on page load and scroll
  window.addEventListener('load', toggleScrollNavbar);
  window.addEventListener('scroll', toggleScrollNavbar);
</script>
