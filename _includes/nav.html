<!-- Navigation -->
<nav class="navbar-modern">
    <div class="navbar-container">
        <!-- Brand/logo -->
        <div class="navbar-brand">
            <a href="{{ site.baseurl }}/" title="HOME">
                <img src="{{ site.baseurl }}/logo.png" alt="logo" class="navbar-logo"/>
            </a>
        </div>

        <!-- Navigation links and search -->
        <div class="navbar-right">
            <div class="navbar-menu" id="navbar-menu">
                <ul class="navbar-links">
                    {% for nav_hash in site.nav %}
                        {% for nav_item in nav_hash %}
                            {% assign lowercase_nav_item = nav_item[0] | downcase %}
                            {% if page.active == lowercase_nav_item %}
                                <li class="navbar-item active">
                                    <a href="{{ nav_item[1] }}" class="navbar-link">{{ nav_item[0] }}</a>
                                </li>
                            {% else %}
                                <li class="navbar-item">
                                    <a href="{{ nav_item[1] }}" class="navbar-link">{{ nav_item[0] }}</a>
                                </li>
                            {% endif %}
                        {% endfor %}
                    {% endfor %}
                </ul>
            </div>
            
            <!-- Search button -->
            <a href="javascript:void(0)" title="SEARCH" class="navbar-search-btn" id="search-toggle-btn">
                <span class="fa fa-search"></span>
            </a>
            
            <!-- Mobile toggle -->
            <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation">
                <span class="navbar-toggle-icon"></span>
            </button>
        </div>
    </div>
</nav>

<!-- Search overlay -->
<div class="super-search" id="js-super-search">
    <a href="javascript:void(0)" class="super-search__close-btn" id="search-close-btn">
        <span class="fa fa-close"></span>
    </a>
    <input
        type="text"
        placeholder="Type here.."
        class="super-search__input"
        id="js-super-search__input"
    >
    <ul class="super-search__results" id="js-super-search__results"></ul>
</div>

<script>
// Super Search functionality
document.addEventListener('DOMContentLoaded', function() {
    // Initialize Super Search
    window.superSearch({
        searchFile: '{{ site.baseurl }}/feed.xml',
        searchSelector: '#js-super-search',
        inputSelector: '#js-super-search__input',
        resultsSelector: '#js-super-search__results'
    });

    // Mobile menu toggle
    const navbarToggle = document.getElementById('navbar-toggle');
    const navbarMenu = document.getElementById('navbar-menu');
    const navbar = document.querySelector('.navbar-modern');
    
    // Toggle mobile menu
    navbarToggle.addEventListener('click', function() {
        this.classList.toggle('open');
        navbarMenu.classList.toggle('open');
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.navbar-modern')) {
            navbarToggle.classList.remove('open');
            navbarMenu.classList.remove('open');
        }
    });
    
    // Add scrolled class on scroll
    function handleScroll() {
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    }
    
    // Initialize scroll state
    handleScroll();
    window.addEventListener('scroll', handleScroll);
});
</script>
