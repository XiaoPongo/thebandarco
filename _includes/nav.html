<!-- Navigation -->
<style>
  .navbar-nav > li > a {
    color: white !important;
    text-shadow: none !important;
  }

  .navbar-nav > li > a:hover,
  .navbar-nav > li.active > a:hover {
    color: #a020f0 !important; /* Purple on hover */
  }

  .navbar-nav > li.active > a {
    color: white !important; /* Default active color */
  }

  /* White hamburger icon */
  .navbar-toggle .fa-bars {
    color: white; /* White hamburger */
    font-size: 24px;
    text-shadow: none !important;
    filter: none !important;
  }

  .navbar-toggle {
    border: none;
    background: transparent !important;
    padding: 10px 15px;
    float: right; /* Move toggle to right */
    margin-left: 10px; /* Space from search button */
  }

  /* Container flex for header to align search and toggle */
  .navbar-header {
    display: flex;
    align-items: center;
  }

  /* Push logo to left */
  .navbar-header > a {
    margin-right: auto;
  }
</style>

<nav class="navbar navbar-default navbar-custom navbar-fixed-top" style="margin-right:1em; z-index: 1030;">
  <div class="container-fluid">
    <div class="navbar-header page-scroll">
      <a href="{{ site.baseurl }}/" title="HOME">
        <img src="{{ site.baseurl }}/logo.png" alt="logo" style="width:150px; cursor:pointer; margin-top:15px;" />
      </a>

      <!-- Your search button here -->
      <button id="search-btn" class="btn btn-default navbar-btn" style="margin-left: 10px;">
        <i class="fa fa-search"></i>
      </button>

      <!-- Hamburger toggle just after search button -->
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-label="Toggle navigation">
        <i class="fa fa-bars"></i>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right" style="margin-right:1em;">
        {% for nav_hash in site.nav %}
          {% for nav_item in nav_hash %}
            {% assign lowercase_nav_item = nav_item[0] | downcase %}
            {% if page.active == lowercase_nav_item %}
              <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% else %}
              <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% endif %}
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
