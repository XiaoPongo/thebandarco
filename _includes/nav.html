<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="{{ site.baseurl }}/" class="logo">
      <img src="{{ site.baseurl }}/logo.png" alt="logo" style="height: 50px;">
    </a>
    
    <!-- Navigation Links -->
    <ul class="nav-links">
      {% for nav_hash in site.nav %}
        {% for nav_item in nav_hash %}
          {% assign lowercase_nav_item = nav_item[0] | downcase %}
          <li {% if page.active == lowercase_nav_item %}class="active"{% endif %}>
            <a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>
    
    <!-- Search Button -->
    <div class="search-container">
      <a href="javascript:void(0)" title="Search" onclick="superSearch.toggle()" class="super-search-btn">
        <span class="fa fa-search"></span>
      </a>
    </div>
    
    <!-- Mobile Menu Button -->
    <button class="hamburger">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<!-- Search Modal -->
<div class="super-search" id="js-super-search">
  <a href="javascript:void(0)" onclick="superSearch.toggle()" class="super-search__close-btn">
    <span class="fa fa-close"></span>
  </a>
  <input
    type="text"
    placeholder="Type here.."
    class="super-search__input"
    id="js-super-search__input"
  >
  <ul class="super-search__results" id="js-super-search__results"></ul>
</div>

<style>
  /* Navbar Styles */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 1000;
    padding: 15px 0;
    transition: all 0.3s ease;
  }
  
  .navbar-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }
  
  .nav-links {
    display: flex;
    list-style: none;
    margin: 0 auto;
    padding: 0;
  }
  
  .search-container {
    margin-left: auto;
    padding-left: 20px;
  }
  
  /* Search Icon Styles */
  .super-search-btn .fa {
    color: white !important;
    font-size: 1.2em;
    transition: all 0.3s ease;
  }
  
  .super-search-btn:hover .fa {
    color: #a020f0 !important;
  }
  
  /* Search Modal Styles */
  .super-search {
    /* Your existing search modal styles */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 9999;
    display: none;
  }
  
  .super-search__input {
    background-color: #373737 !important;
    color: #e9eBe9 !important;
    border: none;
    padding: 15px;
    width: 80%;
    max-width: 600px;
    margin: 20vh auto 0;
    display: block;
    font-family: 'Josefin Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.2em;
  }
  
  /* Mobile styles */
  @media (max-width: 768px) {
    .nav-links {
      position: fixed;
      top: 70px;
      left: -100%;
      width: 100%;
      height: calc(100vh - 70px);
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      transition: left 0.3s ease;
    }
    
    .super-search-btn .fa {
      position: relative;
      right: auto;
      top: auto;
    }
  }
</style>

<script src="{{ site.baseurl }}/js/super-search.js"></script>
<script>
superSearch({
    searchFile: '{{ site.baseurl }}/feed.xml',
    searchSelector: '#js-super-search',
    inputSelector: '#js-super-search__input',
    resultsSelector: '#js-super-search__results'
});

// Mobile menu toggle
const hamburger = document.querySelector('.hamburger');
const navLinks = document.querySelector('.nav-links');
  
hamburger.addEventListener('click', () => {
  hamburger.classList.toggle('active');
  navLinks.classList.toggle('active');
});
  
// Navbar scroll effect
window.addEventListener('scroll', () => {
  const navbar = document.querySelector('.navbar');
  if (window.scrollY > 50) {
    navbar.style.background = 'rgba(0,0,0,0.9)';
  } else {
    navbar.style.background = 'rgba(0,0,0,0.3)';
  }
});
</script>
