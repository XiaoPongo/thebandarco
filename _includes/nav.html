<style>
  /* Flat, seamless navbar */
  .navbar {
    background: transparent;
    color: white;
    position: fixed;
    top: 0;
    width: 100%;
    padding: 0.5rem 1rem;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: none;
    border-radius: 0;
  }

  .navbar-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-grow: 1;
    flex-wrap: wrap;
  }

  .logo img {
    height: 50px;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 1rem;
    margin: 0;
    padding: 0;
  }

  .nav-links li a {
    color: white;
    text-decoration: none;
    padding: 0.5rem;
  }

  .nav-links li.active a,
  .nav-links li a:hover {
    color: #a020f0;
  }

  .search-container a {
    color: white;
    font-size: 1.25rem;
    margin-left: 1rem;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 1rem;
  }

  .hamburger .bar {
    width: 22px;
    height: 2px;
    background: white;
  }

  @media (max-width: 768px) {
    .nav-links {
      flex-direction: column;
      width: 100%;
      display: none;
      background-color: rgba(0, 0, 0, 0.9);
      margin-top: 1rem;
    }

    .nav-links.active {
      display: flex;
    }

    .hamburger {
      display: flex;
    }

    .search-container {
      order: 3;
    }

    .logo {
      order: 1;
    }

    .hamburger {
      order: 2;
    }

    .nav-links li a {
      padding: 1rem;
    }
  }

  /* Allow Vanta behind navbar */
  #vanta-header {
    margin-top: 0;
    padding-top: 70px;
  }

  body {
    margin: 0;
    padding-top: 70px; /* reserve space for fixed navbar */
  }
</style>

<!-- Navbar (put this in your layout before header) -->
<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="{{ site.baseurl }}/" class="logo">
      <img src="{{ site.baseurl }}/logo.png" alt="logo" />
    </a>

    <!-- Navigation Links -->
    <ul class="nav-links">
      {% for nav_hash in site.nav %}
        {% for nav_item in nav_hash %}
          {% assign lowercase_nav_item = nav_item[0] | downcase %}
          <li {% if page.active == lowercase_nav_item %}class="active"{% endif %}>
            <a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>

    <!-- Search Button -->
    <div class="search-container">
      <a href="javascript:void(0)" title="Search" onclick="superSearch.toggle()" class="super-search-btn">
        <span class="fa fa-search"></span>
      </a>
    </div>

    <!-- Hamburger -->
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('active')">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>
