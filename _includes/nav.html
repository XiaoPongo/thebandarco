<!-- Navigation -->
<style>
  .navbar-nav > li > a {
    color: white !important;
    text-shadow: none !important;
  }

  .navbar-nav > li > a:hover,
  .navbar-nav > li.active > a:hover {
    color: #a020f0 !important;
  }

  .navbar-nav > li.active > a {
    color: white !important;
  }

  .navbar-custom {
    background-color: rgba(16, 48, 11, 0.9);
    transition: top 0.3s;
  }

  .scroll-nav {
    display: none;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 9999;
  }
</style>

<nav id="scrolling-navbar" class="navbar navbar-default navbar-custom scroll-nav">
  <div class="container-fluid">
    <div class="navbar-header page-scroll">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-navbar-collapse-scroll">
        <i class="fa fa-bars fa-lg"></i>
      </button>
      <a href="{{ site.baseurl }}/" title="HOME">
        <img src="{{ site.baseurl }}/logo.png" alt="logo" style="width:120px;cursor:pointer;margin-top:10px;" />
      </a>
    </div>

    <div class="collapse navbar-collapse" id="bs-navbar-collapse-scroll">
      <ul class="nav navbar-nav navbar-right" style="margin-right:1em;">
        {% for nav_hash in site.nav %}
          {% for nav_item in nav_hash %}
            {% assign lowercase_nav_item = nav_item[0] | downcase %}
            {% if page.active == lowercase_nav_item %}
              <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% else %}
              <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
            {% endif %}
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>

<script>
  window.addEventListener('scroll', function() {
    const scrollNav = document.getElementById('scrolling-navbar');
    if (window.scrollY > 300) {
      scrollNav.style.display = 'block';
    } else {
      scrollNav.style.display = 'none';
    }
  });
</script>
