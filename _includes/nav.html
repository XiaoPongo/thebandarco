<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="{{ site.baseurl }}/" class="logo">
      <img src="{{ site.baseurl }}/logo.png" alt="logo" style="height: 50px;">
    </a>
    
    <!-- Navigation Links -->
    <ul class="nav-links">
      {% for nav_hash in site.nav %}
        {% for nav_item in nav_hash %}
          {% assign lowercase_nav_item = nav_item[0] | downcase %}
          <li {% if page.active == lowercase_nav_item %}class="active"{% endif %}>
            <a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>
    
    <!-- Search Box -->
    <div class="search-container">
      {% include search.html %}
    </div>
    
    <!-- Mobile Menu Button -->
    <button class="hamburger">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<style>
  /* Navbar Styles */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 1000;
    padding: 15px 0;
    transition: all 0.3s ease;
  }
  
  .navbar-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }
  
  .nav-links {
    display: flex;
    list-style: none;
    margin: 0 auto;
    padding: 0;
  }
  
  .search-container {
    margin-left: auto;
    padding-left: 20px;
  }
  
  /* Mobile styles */
  @media (max-width: 768px) {
    .nav-links {
      position: fixed;
      top: 70px;
      left: -100%;
      width: 100%;
      height: calc(100vh - 70px);
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      transition: left 0.3s ease;
    }
    /* ... other mobile styles ... */
  }
</style>
