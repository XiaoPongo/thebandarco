<!-- Modern, Playful Footer -->
<footer style="background: linear-gradient(135deg, #051233, #1a1a1a); color: white; padding: 4rem 0 2rem; position: relative;">
  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
    <div class="footer-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2rem;">

      <!-- Logo Column -->
      <div class="footer-logo" style="display: flex; flex-direction: column;">
        <img src="/logo1.png" alt="Boost Logo" style="width: 180px; margin-bottom: 1.5rem; object-fit: contain;">
      </div>

      <!-- Navigation Column -->
      <div class="footer-nav" style="display: flex; flex-direction: column; gap: 1rem;">
        <a href="/" class="footer-link">HOME</a>
        <a href="/projects" class="footer-link">PROJECTS</a>
        <a href="/blog" class="footer-link">BLOG</a>
        <a href="/about" class="footer-link">ABOUT ME</a>
      </div>

      <!-- Social + Contact Column -->
      <div class="social-contact" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div style="display: flex; gap: 1rem;">
          {% if site.instagram_username %}
          <a href="https://instagram.com/{{ site.instagram_username }}" target="_blank" class="social-icon"><i class="fa fa-instagram"></i></a>
          {% endif %}
          {% if site.linkedin_username %}
          <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" class="social-icon"><i class="fa fa-linkedin"></i></a>
          {% endif %}
          {% if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="social-icon"><i class="fa fa-github"></i></a>
          {% endif %}
          {% if site.whatsapp_number %}
          <a href="https://wa.me/{{ site.whatsapp_number | remove: '+' }}" target="_blank" class="social-icon"><i class="fa fa-whatsapp"></i></a>
          {% endif %}
        </div>

        <div style="font-size: 0.95rem; line-height: 1.6; color: rgba(255,255,255,0.85);">
          Email me at:<br>
          <a href="mailto:amaydeepp12510@gmail.com" style="color: #FF744D; font-weight: bold; text-decoration: none;">amaydeepp12510<br>@gmail.com</a>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; text-align: center;">
      <p style="color: rgba(255,255,255,0.85); font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 400;">Feed your Curiosity.</p>
      <p style="color: rgba(255,255,255,0.6); font-size: 0.85rem; margin: 0;">©2025 All rights reserved</p>
    </div>
  </div>

  <!-- Scroll to Top -->
  <button onclick="window.scrollTo({top: 0, behavior: 'smooth'});" style="position: fixed; right: 20px; bottom: 20px; width: 40px; height: 40px; background: #E8441D; border: none; border-radius: 50%; color: white; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 999;">
    ↑
  </button>
</footer>

<!-- Styles -->
<style>
  .footer-link {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    font-size: 1.1rem;
    transition: color 0.3s;
  }

  .footer-link:hover {
    color: #E8441D;
  }

  .social-icon {
    color: white;
    font-size: 1.8rem;
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .social-icon:hover {
    transform: translateY(-3px);
    color: #E8441D;
  }

  @media (max-width: 768px) {
    .footer-grid {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .footer-logo,
    .footer-nav,
    .social-contact {
      align-items: center !important;
      justify-content: center !important;
    }

    .social-contact {
      gap: 1rem !important;
    }
  }
</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
