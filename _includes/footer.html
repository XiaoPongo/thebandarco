<!-- Modern, Playful Footer -->
<footer style="background: linear-gradient(135deg, #051233, #1a1a1a); color: white; padding: 3rem 0 2rem; position: relative;">
  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
    <div class="footer-grid" style="display: grid; grid-template-columns: 2fr 3fr 3fr; gap: 2rem; align-items: start;">

      <!-- Logo Column -->
      <div class="footer-logo" style="display: flex; flex-direction: column; justify-content: center;">
        <img src="/logo1.png" alt="Boost Logo" style="width: 150px; object-fit: contain;">
      </div>

      <!-- Spacer Column -->
      <div></div>

      <!-- Social + Contact Column -->
      <div class="social-contact" style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
        <div class="social-row" style="display: flex; gap: 1rem;">
          {% if site.instagram_username %}
          <a href="https://instagram.com/{{ site.instagram_username }}" target="_blank" class="social-icon"><i class="fa fa-instagram"></i></a>
          {% endif %}
          {% if site.linkedin_username %}
          <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" class="social-icon"><i class="fa fa-linkedin"></i></a>
          {% endif %}
          {% if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="social-icon"><i class="fa fa-github"></i></a>
          {% endif %}
          {% if site.whatsapp_number %}
          <a href="https://wa.me/{{ site.whatsapp_number | remove: '+' }}" target="_blank" class="social-icon"><i class="fa fa-whatsapp"></i></a>
          {% endif %}
        </div>

        <div style="font-size: 0.95rem; line-height: 1.6; color: rgba(255,255,255,0.85); text-align: right;">
          Email me at:<br>
          <a href="mailto:amaydeepp12510@gmail.com" style="color: #FF744D; font-weight: bold; text-decoration: none;">amaydeepp12510<br>@gmail.com</a>
        </div>
      </div>
    </div>

    <!-- Interactive Quote Box -->
    <div class="footer-quote-box" onclick="cycleQuote(this)">
      <span class="footer-quote-icon">🐒</span>
      <span id="footer-quote-text">Feed your Curiosity.</span>
    </div>

    <!-- Divider -->
    <div style="margin-top: 2rem; padding-top: 1.5rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
      <p style="color: rgba(255,255,255,0.6); font-size: 0.8rem; margin: 0;">©2025 All rights reserved</p>
    </div>
  </div>

  <!-- Scroll to Top -->
  <button onclick="window.scrollTo({top: 0, behavior: 'smooth'});" style="position: fixed; right: 20px; bottom: 20px; width: 40px; height: 40px; background: #E8441D; border: none; border-radius: 50%; color: white; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 999;">
    ↑
  </button>
</footer>

<!-- Styles -->
<style>
  .footer-link {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    font-size: 1.05rem;
    transition: color 0.3s;
  }

  .footer-link:hover {
    color: #E8441D;
  }

  .social-icon {
    color: white;
    font-size: 1.6rem;
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .social-icon:hover {
    transform: translateY(-3px);
    color: #E8441D;
  }

  .footer-quote-box {
    margin-top: 2rem;
    background: rgba(255, 255, 255, 0.05);
    padding: 1rem 1.5rem;
    border-radius: 12px;
    text-align: center;
    color: white;
    font-size: 1.2rem;
    font-weight: 500;
    display: inline-block;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: pulse 2.5s infinite;
  }

  .footer-quote-box:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FF744D;
  }

  .footer-quote-box.animate {
    animation: clickBounce 0.5s ease;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  @keyframes clickBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  .footer-quote-icon {
    margin-right: 0.5rem;
  }

  @media (max-width: 768px) {
    .footer-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2rem;
    }

    .footer-logo {
      align-items: flex-start !important;
    }

    .social-contact {
      align-items: center !important;
      gap: 1.2rem !important;
    }

    .footer-quote-box {
      margin-top: 1.5rem;
      font-size: 1.1rem;
    }
  }
</style>

<script>
  const quotes = [
    "Feed your Curiosity.",
    "Curiosity never sleeps.",
    "Tap into the unknown.",
    "Click me again, I dare you.",
    "Follow the monkey 🐒"
  ];

  let currentQuoteIndex = 0;
  function cycleQuote(element) {
    currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
    document.getElementById("footer-quote-text").innerText = quotes[currentQuoteIndex];
    element.classList.remove("animate");
    void element.offsetWidth; // Trigger reflow
    element.classList.add("animate");
  }
</script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
