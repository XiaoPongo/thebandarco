<a href="javascript:void(0)" title="Search" class="super-search-btn">
  <span class="fa fa-search" style="font-size:1em;"></span>
</a>

<div class="super-search" id="js-super-search">
  <a href="javascript:void(0)" class="super-search__close-btn">
    <span class="fa fa-close" style="font-size:48px;"></span>
  </a>
  <input
    type="text"
    placeholder="Type here.."
    class="super-search__input"
    id="js-super-search__input"
  >
  <ul class="super-search__results is-hidden" id="js-super-search__results"></ul>
</div>

<style>
/* Make the search icon white by default */
.super-search-btn .fa {
  color: white !important;
}

/* Turn the search icon purple on hover */
.super-search-btn:hover .fa {
  color: #a020f0 !important;
}

/* Style the search input box */
.super-search__input {
  background-color: #373737 !important;
  color: #e9eBe9 !important;
  border: none;
  padding: 10px;
  font-family: 'Josefin Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-weight: 600;
  font-style: italic;
}

/* Placeholder text style */
.super-search__input::placeholder {
  color: #e9eBe9 !important;
  font-family: 'Josefin Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-weight: 600;
  font-style: italic;
}

/* Make the button fixed, clickable, and always visible */
.super-search-btn {
  position: fixed;
  top: 1em;
  right: 0.75em;
  z-index: 9999;
  cursor: pointer;
}

/* Style the icon inside */
.super-search-btn .fa {
  font-size: 1.2em;
  color: white !important;
}

/* Hover effect */
.super-search-btn:hover .fa {
  color: #a020f0 !important;
}
</style>

<script src="{{ site.baseurl }}/js/super-search.js"></script>

<script>
  // Initialize super search and store the instance
  const superSearchInstance = superSearch({
    searchFile: '{{ site.baseurl }}/feed.xml',
    searchSelector: '#js-super-search',
    inputSelector: '#js-super-search__input',
    resultsSelector: '#js-super-search__results'
  });

  // Attach event listeners to open/close buttons
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.querySelector('.super-search-btn');
    const closeBtn = document.querySelector('.super-search__close-btn');

    toggleBtn?.addEventListener('click', () => superSearchInstance.toggle());
    closeBtn?.addEventListener('click', () => superSearchInstance.toggle());
  });
</script>
