<!-- Search Button -->
<a href="#" title="Search" class="super-search-btn">
  <span class="fa fa-search"></span>
</a>

<!-- Search Overlay -->
<div class="super-search" id="js-super-search">
  <a href="#" class="super-search__close-btn">
    <span class="fa fa-close" style="font-size:48px;"></span>
  </a>
  <input
    type="text"
    placeholder="Type here..."
    class="super-search__input"
    id="js-super-search__input"
  >
  <ul class="super-search__results is-hidden" id="js-super-search__results"></ul>
</div>

<!-- Styles -->
<style>
  /* Search Button Styles */
  .super-search-btn {
    position: fixed;
    top: 1em;
    right: 0.75em;
    z-index: 9999;
    cursor: pointer;
  }

  .super-search-btn .fa {
    font-size: 1.2em;
    color: white !important;
  }

  .super-search-btn:hover .fa {
    color: #a020f0 !important;
  }

  /* Search Overlay Styles */
  .super-search {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(55, 55, 55, 0.95);
    z-index: 9998;
    padding: 2em;
    box-sizing: border-box;
  }

  .super-search.is-active {
    display: block;
  }

  .super-search__close-btn {
    position: absolute;
    top: 1em;
    right: 1em;
    cursor: pointer;
    color: white;
  }

  .super-search__input {
    width: 100%;
    padding: 10px;
    font-family: 'Josefin Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 600;
    font-style: italic;
    background-color: #373737 !important;
    color: #e9eBe9 !important;
    border: none;
    margin-top: 2em;
  }

  .super-search__input::placeholder {
    color: #e9eBe9 !important;
    font-family: 'Josefin Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 600;
    font-style: italic;
  }

  .super-search__results {
    margin-top: 1em;
    list-style: none;
    padding: 0;
    color: white;
  }

  .super-search__results.is-hidden {
    display: none;
  }

  .super-search__results li {
    margin-bottom: 0.5em;
  }

  .super-search__results a {
    color: white;
    text-decoration: none;
  }

  .super-search__results a:hover {
    text-decoration: underline;
  }

  .super-search__result-date {
    display: block;
    font-size: 0.8em;
    color: #ccc;
  }
</style>

<!-- Scripts -->
<script src="{{ site.baseurl }}/js/super-search.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Initialize superSearch with JSON file instead of XML feed
    const superSearchInstance = superSearch({
      searchFile: '{{ site.baseurl }}/search.json',  // <-- your JSON index here
      searchSelector: '#js-super-search',
      inputSelector: '#js-super-search__input',
      resultsSelector: '#js-super-search__results'
    });

    // Toggle function to show/hide search overlay
    function toggleSearch() {
      const searchEl = document.querySelector('#js-super-search');
      if (searchEl.classList.contains('is-active')) {
        searchEl.classList.remove('is-active');
        document.body.style.overflow = '';
      } else {
        searchEl.classList.add('is-active');
        document.body.style.overflow = 'hidden';
        document.querySelector('#js-super-search__input').focus();
      }
    }

    // Event listeners for open/close buttons
    document.querySelector('.super-search-btn').addEventListener('click', function (e) {
      e.preventDefault();
      toggleSearch();
    });

    document.querySelector('.super-search__close-btn').addEventListener('click', function (e) {
      e.preventDefault();
      toggleSearch();
    });

    // Close on ESC key
    document.addEventListener('keyup', function (e) {
      if (e.key === 'Escape') {
        const searchEl = document.querySelector('#js-super-search');
        if (searchEl.classList.contains('is-active')) {
          toggleSearch();
        }
      }
    });
  });
</script>
